  ctx.moveTo(x0, y - 5); ctx.lineTo(x0, y + 5);
  ctx.moveTo(x1, y - 5); ctx.lineTo(x1, y + 5);
  ctx.stroke();
  
  ctx.fillStyle = getCss('--ink'); 
  ctx.textAlign = 'center';
  ctx.fillText(label, (x0 + x1) / 2, y - 8);
}

/* =========================================================================
   HIT TESTING
   ========================================================================= */
function findSnapTargetNode(excludeId, px, py, thresholdPx=24){
  let best=null, bestD=thresholdPx;
  nodes.forEach(other=>{
    if(other.id===excludeId) return;
    const p=toScreen(other.x,other.y);
    const d=Math.hypot(p.x-px, p.y-py);
    if(d<bestD){ bestD=d; best=other; }
  });
  return best;
}
function hitTestNode(px,py){
  let best=null, bestD=12;
  nodes.forEach(n=>{ const p=toScreen(n.x,n.y); const d=Math.hypot(p.x-px,p.y-py); if(d<bestD){bestD=d;best=n.id;} });
  return best;
}
function hitTestElement(px,py){
  let best=null, bestD=8;
  elements.forEach(el=>{
    const a=getNode(el.n1), b=getNode(el.n2);
    const pa=toScreen(a.x,a.y), pb=toScreen(b.x,b.y);
    const d=distToSeg(px,py,pa.x,pa.y,pb.x,pb.y);
    if(d<bestD){ bestD=d; best=el.id; }
  });
  return best;
}
function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const len2=dx*dx+dy*dy;
  let t = len2>0 ? ((px-x1)*dx+(py-y1)*dy)/len2 : 0;
  t=Math.max(0,Math.min(1,t));
  const cx=x1+t*dx, cy=y1+t*dy;
  return Math.hypot(px-cx,py-cy);
}
function projectOnElement(elId,px,py){
  const el=getElement(elId), a=getNode(el.n1), b=getNode(el.n2);
  const pa=toScreen(a.x,a.y), pb=toScreen(b.x,b.y);
  const dx=pb.x-pa.x, dy=pb.y-pa.y; const len2=dx*dx+dy*dy;
  let t = len2>0 ? ((px-pa.x)*dx+(py-pa.y)*dy)/len2 : 0;
  return Math.max(0,Math.min(1,t));
}

/* ---- box (rubber-band) selection: AutoCAD-style window (L->R, full containment)
   vs crossing (R->L, any overlap) selection, tested in screen space ---- */
function rectContainsPoint(rect,p){ return p.x>=rect.x0 && p.x<=rect.x1 && p.y>=rect.y0 && p.y<=rect.y1; }
function ccw3(a,b,c){ return (c.y-a.y)*(b.x-a.x) - (b.y-a.y)*(c.x-a.x); }
function segSegIntersect(p1,p2,p3,p4){
  const d1=ccw3(p3,p4,p1), d2=ccw3(p3,p4,p2), d3=ccw3(p1,p2,p3), d4=ccw3(p1,p2,p4);
  if(((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0))) return true;
  return false;
}
function segIntersectsRect(pa,pb,rect){
  if(rectContainsPoint(rect,pa) || rectContainsPoint(rect,pb)) return true;
  const c1={x:rect.x0,y:rect.y0}, c2={x:rect.x1,y:rect.y0}, c3={x:rect.x1,y:rect.y1}, c4={x:rect.x0,y:rect.y1};
  return segSegIntersect(pa,pb,c1,c2) || segSegIntersect(pa,pb,c2,c3) || segSegIntersect(pa,pb,c3,c4) || segSegIntersect(pa,pb,c4,c1);
}
function applyBoxSelection(x0,y0,x1,y1,isWindow){
  const rect={x0,y0,x1,y1};
  const nodeIds=[];
  nodes.forEach(n=>{ if(rectContainsPoint(rect, toScreen(n.x,n.y))) nodeIds.push(n.id); });
  const elemIds=[];
  elements.forEach(el=>{
    const a=getNode(el.n1), b=getNode(el.n2);
    const pa=toScreen(a.x,a.y), pb=toScreen(b.x,b.y);
    if(isWindow){ if(rectContainsPoint(rect,pa) && rectContainsPoint(rect,pb)) elemIds.push(el.id); }
    else { if(segIntersectsRect(pa,pb,rect)) elemIds.push(el.id); }
  });
  selection = {nodeIds, elemIds};
}

  closeExportModal();

function confirmExport(){
  const inp=document.getElementById('exportFileNameInput');
  let rawName = inp ? (inp.value.trim() || 'model-mes-2d') : 'model-mes-2d';
  // usunięcie ewentualnego podwójnego rozszerzenia .json wpisanego przez użytkownika
  if(rawName.toLowerCase().endsWith('.json')){
    rawName = rawName.slice(0, -5);
  }
  rawName = rawName || 'model-mes-2d';
  currentModelFileName = rawName; // zapamiętanie wpisanej nazwy na przyszłość
  const fileName = currentModelFileName + '.json';
  closeExportModal();

  const data={
    nodes,
    elements,
    materials,
    sections,
    analysisSettings: analysisSettings || { type: 'linear_static', params: { bucklingModes: 4 } },
    nextNodeId,
    nextElemId,
    nextMatId,
    nextSecId,
    defaultSectionId,
    defaultMaterialId
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=fileName; a.click();
  URL.revokeObjectURL(url);
  setStatusHint(`Pobrano plik: ${fileName}`);
}

function exportModel(){
  openExportModal();
}
function importModelFile(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      nodes=data.nodes||[]; elements=data.elements||[];
      materials=data.materials||materials; sections=data.sections||sections;
      if(data.analysisSettings && typeof data.analysisSettings === 'object'){
        analysisSettings = {
          type: data.analysisSettings.type || 'linear_static',
          params: Object.assign({ bucklingModes: 4 }, data.analysisSettings.params || {})
        };
      } else {
        analysisSettings = { type: 'linear_static', params: { bucklingModes: 4 } };
      }
      nextNodeId=data.nextNodeId||uid(nodes); nextElemId=data.nextElemId||uid(elements);
      nextMatId=data.nextMatId||uid(materials); nextSecId=data.nextSecId||uid(sections);
      defaultSectionId=data.defaultSectionId||sections[0].id; defaultMaterialId=data.defaultMaterialId||materials[0].id;
      if(file.name){
        currentModelFileName = file.name.replace(/\.json$/i, '') || 'model-mes-2d';
      }
      invalidateResults(); clearSelection();
      fitView(); buildToolbar(); renderSidebar(); render();
    }catch(err){ setStatusHint('Błąd wczytywania pliku: '+err.message); }
  };
  reader.readAsText(file);
  e.target.value='';
}

/* =========================================================================
   EVENTS
   ========================================================================= */
function onDown(e){
  if(e.button!==0) return;
  const rect=canvas.getBoundingClientRect();
  handlePointerDown(e.clientX-rect.left, e.clientY-rect.top);
}
function handlePointerDown(px,py){
  hoverNodeId=null; hoverElemId=null;
  // każda nowa akcja chowa poprzedni podgląd współrzędnych/wymiarów
  lastPlacedNodeId=null; lastDrawnElemId=null;
  if(mode==='select'){
    setStatusHint(selectModeHint());
    const nid=hitTestNode(px,py);
    if(nid!=null){
      const nodeObj = getNode(nid);
      selection={nodeIds:[nid],elemIds:[]};
      dragNode=nid;
      dragNodeState={
        nodeId: nid,
        startPx: px,
        startPy: py,
        origX: nodeObj ? nodeObj.x : 0,
        origY: nodeObj ? nodeObj.y : 0,
        moved: false
      };
      renderSidebar();
      render();
      return;
    }
    const eid=hitTestElement(px,py);
    if(eid!=null){
      selection={nodeIds:[],elemIds:[eid]};
      probe.elId=eid;
      probe.t=projectOnElement(eid,px,py);
      renderSidebar(); render(); return;
    }
    if(boxSelectEnabled){
      // empty area + box-select toggle ON: start a rubber-band drag instead of panning.
      // Whether it ends up being a box-select or just a deselect-tap is decided on pointer-up.
      clearSelection();
      boxSelectState={startX:px,startY:py,curX:px,curY:py,moved:false};
      renderSidebar(); render();
      return;
    }
    clearSelection();
    panState={startX:px,startY:py,startOffX:view.offX,startOffY:view.offY,moved:false};
    renderSidebar(); render();
  } else if(mode==='addNode' || mode==='addBar' || mode==='delete'){
    // Defer the actual action to pointer-up: a drag from here should pan the view
    // (and, mid-pinch, get cleared entirely by onTouchStart) rather than immediately
    // place/delete something — only a genuine tap (no significant movement) acts.
    panState={startX:px,startY:py,startOffX:view.offX,startOffY:view.offY,moved:false,tapMode:mode};
  }
}
function performTapAction(tapMode,px,py){
  const mp=toModel(px,py);
  if(tapMode==='addNode'){
    const nid=hitTestNode(px,py);
    if(nid!=null){
      setStatusHint('Węzeł w tym miejscu już istnieje.');
      return;
    }
    const snappedX = snap(mp.x);
    const snappedY = snap(mp.y);
    const existing = nodes.find(n => Math.hypot(n.x - snappedX, n.y - snappedY) < 1e-4);
    if(existing){
      setStatusHint('Węzeł o tych współrzędnych już istnieje.');
      return;
    }
    lastPlacedNodeId = createNode(mp.x,mp.y);
    setStatusHint('Tryb: Dodaj węzeł — kliknij na płótnie, aby dodać węzeł');
    renderSidebar(); render();
  } else if(tapMode==='addBar'){
    const nid=hitTestNode(px,py);
    if(nid==null && !allowNewNodesInBarMode){
      setStatusHint('Tryb: Dodaj pręt — „Nowe węzły” wyłączone: kliknij istniejący węzeł');
      return;
    }
    let useId = nid;
    if(useId == null){
      const snappedX = snap(mp.x);
      const snappedY = snap(mp.y);
      const existing = nodes.find(n => Math.hypot(n.x - snappedX, n.y - snappedY) < 1e-4);
      useId = existing ? existing.id : createNode(mp.x,mp.y);
    }
    if(barStart==null){
      barStart=useId;
      setStatusHint('Tryb: Dodaj pręt — wybierz węzeł końcowy');
    } else if(barStart===useId){
      setStatusHint('Wybrano ten sam węzeł.');
    } else {
      const exists = elements.some(e=>(e.n1===barStart&&e.n2===useId)||(e.n1===useId&&e.n2===barStart));
      if(exists){
        setStatusHint(`Pręt między węzłami W${barStart} i W${useId} już istnieje.`);
        barStart=useId;
      } else {
        const createdId = createElement(barStart,useId);
        if(createdId!=null){
          barStart=useId;
          lastDrawnElemId = createdId;
          setStatusHint('Tryb: Dodaj pręt — wybierz węzeł końcowy');
        }
      }
    }
    renderSidebar(); render();
  } else if(tapMode==='delete'){
    const nid=hitTestNode(px,py);
    if(nid!=null){ deleteNode(nid); renderSidebar(); render(); return; }
    const eid=hitTestElement(px,py);
    if(eid!=null){ deleteElement(eid); renderSidebar(); render(); }
  }
}
function onMove(e){
  const rect=canvas.getBoundingClientRect();
  handlePointerMove(e.clientX-rect.left, e.clientY-rect.top);
}
function handlePointerMove(px,py){
  mouseModel=toModel(px,py);
  const coordsEl=document.getElementById('coords');
  if(coordsEl) coordsEl.textContent = `x=${mouseModel.x.toFixed(2)}\u00A0m,  y=${mouseModel.y.toFixed(2)}\u00A0m`;
  if(dragNode!=null){
    const n=getNode(dragNode);
    if(n){
      const applyNodePos = ()=>{
        const snapTarget = findSnapTargetNode(dragNode, px, py, 24);
        if(snapTarget){
          n.x = snapTarget.x;
          n.y = snapTarget.y;
        } else {
          n.x = snap(mouseModel.x);
          n.y = snap(mouseModel.y);
        }
        invalidateResults();
      };
      if(!dragNodeState || dragNodeState.moved){
        applyNodePos();
      } else {
        const distPx = Math.hypot(px - dragNodeState.startPx, py - dragNodeState.startPy);
        if(distPx > 10){ // próg 10px celowego ruchu palcem/kursorem
          dragNodeState.moved = true;
          applyNodePos();
        }
      }
    }
    render();
    return;
  }
  if(boxSelectState){
    boxSelectState.curX=px; boxSelectState.curY=py;
    if(!boxSelectState.moved && Math.hypot(px-boxSelectState.startX,py-boxSelectState.startY)>6) boxSelectState.moved=true;
    canvas.style.cursor='crosshair';
    render();
    return;
  }
  if(panState){
    const dx=px-panState.startX, dy=py-panState.startY;
    if(Math.hypot(dx,dy)>6){ panState.moved=true; userAdjustedView=true; }
    view.offX=panState.startOffX+dx; view.offY=panState.startOffY+dy;
    render();
    return;
  }
  if(mode==='select'){
    const nid=hitTestNode(px,py);
    const eid = nid==null? hitTestElement(px,py): null;
    if(nid!==hoverNodeId || eid!==hoverElemId){ hoverNodeId=nid; hoverElemId=eid; render(); }
    canvas.style.cursor = (nid!=null||eid!=null)? 'pointer':(panState?'grabbing':'default');
  } else {
    canvas.style.cursor='crosshair';
  }
}
function onUp(e){ handlePointerUp(); }
function handlePointerUp(){
  hoverNodeId=null; hoverElemId=null;
  if(dragNode!=null){
    const draggedId = dragNode;
    const wasMoved = dragNodeState ? dragNodeState.moved : false;
    dragNode=null;
    dragNodeState=null;
    if(wasMoved){
      const mergedTargetId = checkAndMergeCoincidentNode(draggedId);
      if(!mergedTargetId){
        setStatusHint(selectModeHint());
      }
    }
    renderSidebar(); render();
  }
  if(boxSelectState){
    if(boxSelectState.moved){
      const x0=Math.min(boxSelectState.startX,boxSelectState.curX), x1=Math.max(boxSelectState.startX,boxSelectState.curX);
      const y0=Math.min(boxSelectState.startY,boxSelectState.curY), y1=Math.max(boxSelectState.startY,boxSelectState.curY);
      const isWindow = boxSelectState.curX >= boxSelectState.startX; // left->right = window (full containment), right->left = crossing (any overlap)
      applyBoxSelection(x0,y0,x1,y1,isWindow);
    }
    boxSelectState=null;
    renderSidebar(); render();
    return;
  }
  if(panState && panState.tapMode && !panState.moved){
    performTapAction(panState.tapMode, panState.startX, panState.startY);
  }
  panState=null;
}
function onWheel(e){
  e.preventDefault();
  userAdjustedView=true;
  const rect=canvas.getBoundingClientRect();
  const px=e.clientX-rect.left, py=e.clientY-rect.top;
  const before=toModel(px,py);
  const factor=e.deltaY<0?1.12:1/1.12;
  const newScale=Math.max(2,Math.min(1200,view.scale*factor));
  view.offX = px-before.x*newScale;
  view.offY = py+before.y*newScale;
  view.scale=newScale;
  render();
}
function zoomBy(factor){
  userAdjustedView=true;
  const rect=canvas.getBoundingClientRect();
  const cx=rect.width/2, cy=rect.height/2;
  const before=toModel(cx,cy);
  const newScale=Math.max(2,Math.min(1200,view.scale*factor));
  view.offX=cx-before.x*newScale; view.offY=cy+before.y*newScale; view.scale=newScale;
  render();
}
function onKey(e){
  const tag=(e.target.tagName||'').toUpperCase();
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
  if((e.ctrlKey||e.metaKey) && !e.shiftKey && (e.key==='z'||e.key==='Z')){ e.preventDefault(); doUndo(); return; }
  if((e.ctrlKey||e.metaKey) && ((e.key==='y'||e.key==='Y') || (e.shiftKey && (e.key==='z'||e.key==='Z')))){ e.preventDefault(); doRedo(); return; }
  if(e.key==='Escape'){
    if(document.getElementById('exportOverlay')){ closeExportModal(); return; }
    if(document.getElementById('optionsOverlay')){ closeOptionsModal(); return; }
    setMode('select'); return;
  }
  if(e.key==='Delete'||e.key==='Backspace'){
    if(selection.nodeIds.length || selection.elemIds.length){
      selection.elemIds.slice().forEach(id=>deleteElement(id));
      selection.nodeIds.slice().forEach(id=>deleteNode(id));
      clearSelection();
      renderSidebar(); render();
    }
    return;
  }
  if(e.key==='ArrowLeft'){
    if(solved && solved.type==='stability'){ e.preventDefault(); prevBucklingMode(); return; }
    if(solved && solved.type==='modal'){ e.preventDefault(); prevModalMode(); return; }
  }
  if(e.key==='ArrowRight'){
    if(solved && solved.type==='stability'){ e.preventDefault(); nextBucklingMode(); return; }
    if(solved && solved.type==='modal'){ e.preventDefault(); nextModalMode(); return; }
  }
  if(e.key==='v'||e.key==='V') setMode('select');
  if(e.key==='n'||e.key==='N') setMode('addNode');
  if(e.key==='b'||e.key==='B') setMode('addBar');
  if(e.key==='Enter') toggleSolveOrBack();
}

/* ---- touch: 1 finger = tap/select/drag/pan (reuses pointer logic), 2 fingers = pinch-zoom ---- */
let touchPinch=null;
function touchPt(t){
  const rect=canvas.getBoundingClientRect();
  return {x:t.clientX-rect.left, y:t.clientY-rect.top};
}
function touchDist(e){
  const a=touchPt(e.touches[0]), b=touchPt(e.touches[1]);
  return Math.hypot(b.x-a.x,b.y-a.y);
}
function touchMid(e){
  const a=touchPt(e.touches[0]), b=touchPt(e.touches[1]);
  return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};
}
function onTouchStart(e){
  e.preventDefault();
  if(e.touches.length===1){
    touchPinch=null;
    const p=touchPt(e.touches[0]);
    handlePointerDown(p.x,p.y);
  } else if(e.touches.length>=2){
    dragNode=null; dragNodeState=null; panState=null; boxSelectState=null;
    const mid=touchMid(e);
    const before=toModel(mid.x,mid.y);
    touchPinch={ startDist:touchDist(e), startScale:view.scale, anchorModel:before };
  }
}
function onTouchMove(e){
  e.preventDefault();
  if(e.touches.length===1 && !touchPinch){
    const p=touchPt(e.touches[0]);
    handlePointerMove(p.x,p.y);
  } else if(e.touches.length>=2 && touchPinch){
    userAdjustedView=true;
    const newDist=touchDist(e);
    const newScale=Math.max(2,Math.min(1200, touchPinch.startScale*(newDist/touchPinch.startDist)));
    const mid=touchMid(e);
    view.scale=newScale;
    view.offX = mid.x - touchPinch.anchorModel.x*newScale;
    view.offY = mid.y + touchPinch.anchorModel.y*newScale;
    render();
  }
}
function onTouchEnd(e){
  e.preventDefault();
  if(e.touches.length===0){ handlePointerUp(); touchPinch=null; }
  else if(e.touches.length===1){ touchPinch=null; dragNode=null; dragNodeState=null; panState=null; boxSelectState=null; }
}

function initEvents(){
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('wheel', onWheel, {passive:false});
  canvas.addEventListener('touchstart', onTouchStart, {passive:false});
  canvas.addEventListener('touchmove', onTouchMove, {passive:false});
  canvas.addEventListener('touchend', onTouchEnd, {passive:false});
  canvas.addEventListener('touchcancel', onTouchEnd, {passive:false});
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', ()=>setTimeout(resizeCanvas,150));
  document.getElementById('zoomIn').addEventListener('click', ()=>zoomBy(1.25));
  document.getElementById('zoomOut').addEventListener('click', ()=>zoomBy(1/1.25));
  document.getElementById('zoomFit').addEventListener('click', ()=>{ fitView(); render(); });
}

/* =========================================================================
   UNDO / REDO
   Every mutating action in this app (create/delete/edit node or element,
   library changes, split, import, examples...) ends by calling renderSidebar().
   So instead of instrumenting every single mutation site, we take a snapshot
   of the *model* (nodes/elements/materials/sections/counters — not UI state
   like selection, view, or diagram toggles) each time renderSidebar runs, and
   diff it against the previous one. A real difference = one completed user
   action = one undo step. Continuous gestures (dragging a node) only call
   renderSidebar once, at the end, so they collapse into a single step too.
   ========================================================================= */
function modelSnapshot(){
  return JSON.stringify({nodes,elements,materials,sections,
    analysisSettings,
    nextNodeId,nextElemId,nextMatId,nextSecId,defaultSectionId,defaultMaterialId});
}
function checkAndPushHistory(){
  const cur=modelSnapshot();
  if(lastSnapshot!==null && cur!==lastSnapshot){
    undoStack.push(lastSnapshot);
    if(undoStack.length>MAX_HISTORY) undoStack.shift();
    redoStack=[];
  }
  lastSnapshot=cur;
  updateUndoRedoButtons();
}
function restoreSnapshot(json){
  const d=JSON.parse(json);
  nodes=d.nodes; elements=d.elements; materials=d.materials; sections=d.sections;
  if(d.analysisSettings && typeof d.analysisSettings === 'object'){
    analysisSettings = {
      type: d.analysisSettings.type || 'linear_static',
      params: Object.assign({ bucklingModes: 4, modalModes: 4, includeElementMass: true }, d.analysisSettings.params || {})
    };
  } else {
    analysisSettings = { type: 'linear_static', params: { bucklingModes: 4, modalModes: 4, includeElementMass: true } };
  }
  nextNodeId=d.nextNodeId; nextElemId=d.nextElemId; nextMatId=d.nextMatId; nextSecId=d.nextSecId;
  defaultSectionId=d.defaultSectionId; defaultMaterialId=d.defaultMaterialId;
  invalidateResults();
  lastSnapshot=modelSnapshot(); // sync first, so the renderSidebar() call below doesn't re-trigger history
  splitFormElId=null;
  buildToolbar();
  renderSidebar(); render();
}
function doUndo(){
  if(undoStack.length===0) return;
  redoStack.push(modelSnapshot());
  restoreSnapshot(undoStack.pop());
  setStatusHint('Cofnięto ostatnią zmianę.');
}
function doRedo(){
  if(redoStack.length===0) return;
  undoStack.push(modelSnapshot());
  restoreSnapshot(redoStack.pop());
  setStatusHint('Ponowiono zmianę.');
}
function updateUndoRedoButtons(){
  const u=document.getElementById('btnUndo'), r=document.getElementById('btnRedo');
  if(u) u.disabled = undoStack.length===0;
  if(r) r.disabled = redoStack.length===0;
}

function presetMatches(n,key){
  const sp=n.support; const t=(d)=>d?d.type:'free';
  if(key==='none') return !sp || (t(sp.ux)==='free'&&t(sp.uy)==='free'&&t(sp.rz)==='free');
  if(!sp) return false;
  if(key==='fixed') return t(sp.ux)==='fixed'&&t(sp.uy)==='fixed'&&t(sp.rz)==='fixed';
  if(key==='pin') return t(sp.ux)==='fixed'&&t(sp.uy)==='fixed'&&t(sp.rz)==='free';
  if(key==='rollerH') return t(sp.ux)==='free'&&t(sp.uy)==='fixed'&&t(sp.rz)==='free';
  if(key==='rollerV') return t(sp.ux)==='fixed'&&t(sp.uy)==='free'&&t(sp.rz)==='free';
  return false;
}
/* nodesArr: one or more selected node objects. type/k/delta each fall back to a
   "— różne —" placeholder in the dropdown / a blank+"różne" number field when the
   selected nodes disagree, exactly like the numeric bulk fields elsewhere in this panel. */
function dirBlock(nodesArr,key,label,isRot){
  const commonType = commonVal(nodesArr, n=> n.support? dirType(n.support[key]) : 'free');
  let html=`<div class="row"><label>${label}</label>
    <select onchange="bulkUpdateSupportDir('${key}','type',this.value)">
      ${selectMixedOption(commonType===undefined)}
      <option value="free" ${commonType==='free'?'selected':''}>Swobodny</option>
      <option value="fixed" ${commonType==='fixed'?'selected':''}>Sztywny</option>
      <option value="spring" ${commonType==='spring'?'selected':''}>Sprężysty</option>
    </select></div>`;
  if(commonType==='spring'){
    const kVal=commonVal(nodesArr, n=> (n.support&&n.support[key])? (n.support[key].k||0):0);
    html+=`<div class="row"><label></label><input type="number" step="50" ${numInputAttrs(kVal)} onchange="bulkUpdateSupportDir('${key}','k',this.value)"><span class="unit">${isRot?'kNm/rad':'kN/m'}</span></div>`;
  }
  if(commonType && commonType!=='free'){
    const dVal=commonVal(nodesArr, n=> (n.support&&n.support[key])? (n.support[key].delta||0):0);
    html+=`<div class="row"><label>${commonType==='spring'?'Wymuszenie':'Osiadanie'}</label><input type="number" step="0.5" ${numInputAttrs(dVal)} onchange="bulkUpdateSupportDir('${key}','delta',this.value)"><span class="unit">${isRot?'°':'cm'}</span></div>`;
  }
  return html;
}
function panelNode(nodesArr){
  const multi = nodesArr.length>1;
  const header = multi? `Węzły (${nodesArr.length}): ${nodesArr.map(n=>'W'+n.id).join(', ')}` : `Węzeł W${nodesArr[0].id}`;
  const forceStates = nodesArr.map(n=>!!n.force), noneForce = forceStates.every(v=>!v);
  const forceModeCommon = commonVal(nodesArr, n=> n.force? (n.force.mode||'polar') : undefined);
  const fVal = commonVal(nodesArr, n=> n.force? n.force.F : undefined);

function closeSplitForm(){ splitFormElId=null; renderSidebar(); }
function setSplitMode(m){ splitMode=m; renderSidebar(); }
function setSplitT(v){ splitT=Math.max(0.02,Math.min(0.98,parseFloat(v)||0.5)); }
function setSplitN(v){ splitN=Math.max(2,Math.min(30,Math.round(parseFloat(v)||2))); }
function splitFormHtml(el){

    </div>

function splitFormHtmlBulk(elArr){
  const L0=elLength(elArr[0]);
  return `<div class="card" style="margin-top:8px;background:var(--surface);border-color:var(--input-border);">
    <div class="btnrow" style="margin-bottom:8px;">
      <button class="mini ${splitMode==='single'?'on':''}" onclick="setSplitMode('single')">Pojedynczy podział</button>

    </div>

    `}
    <div class="btnrow" style="margin-top:8px;">

function splitElement(elId,points){
  const el=getElement(elId); if(!el) return [];
  const a=getNode(el.n1), b=getNode(el.n2);
  const allT=[0,...points,1];
  const nodeIds=[el.n1];
  for(let i=1;i<allT.length-1;i++){
    const t=allT[i];
    nodeIds.push(createNode(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t, true));
  }
  nodeIds.push(el.n2);
  const newElIds=[];
  for(let i=0;i<allT.length-1;i++){
    const t0=allT[i], t1=allT[i+1];
    const newId=createElement(nodeIds[i],nodeIds[i+1]);
    if(newId==null) continue;
    const ne=getElement(newId);
    ne.sectionId=el.sectionId; ne.materialId=el.materialId;
    ne.hingeStart = (i===0)? el.hingeStart : false;
    ne.hingeEnd = (i===allT.length-2)? el.hingeEnd : false;
    if(el.hingeStart && el.momentHingeStart && (i===0)) ne.momentHingeStart = el.momentHingeStart;
    if(el.hingeEnd && el.momentHingeEnd && (i===allT.length-2)) ne.momentHingeEnd = el.momentHingeEnd;
    if(el.thermal) ne.thermal={dTtop:el.thermal.dTtop, dTbottom:el.thermal.dTbottom};
    if(el.q){
      const qAt=(t)=>el.q.qStart+(el.q.qEnd-el.q.qStart)*t;
      ne.q={qStart:qAt(t0), qEnd:qAt(t1), angle:el.q.angle, mode:el.q.mode||'resultant'};
    }
    newElIds.push(newId);
  }
  deleteElement(elId);
  return newElIds;
}
function confirmSplit(elId){
  const el=getElement(elId); if(!el) return;
  let points;
  if(splitMode==='single'){ points=[splitT]; }
  else { points=[]; for(let i=1;i<splitN;i++) points.push(i/splitN); }
  const newIds=splitElement(elId,points);
  closeSplitForm();
  selection = {nodeIds:[], elemIds: newIds.length? [newIds[0]] : []};
  invalidateResults(); renderSidebar(); render();
}
function confirmSplitBulk(){
  const ids = selectedElements().map(e=>e.id);
  let points;
  if(splitMode==='single'){ points=[splitT]; }
  else { points=[]; for(let i=1;i<splitN;i++) points.push(i/splitN); }
  let allNewIds=[];
  ids.forEach(id=>{ allNewIds = allNewIds.concat(splitElement(id,points)); });
  closeSplitForm();
  selection = {nodeIds:[], elemIds: allNewIds};
  invalidateResults(); renderSidebar(); render();
}

function findOrCreateNodeAt(x, y, tol=1e-4){
  const existing = nodes.find(n => Math.hypot(n.x - x, n.y - y) < tol);
  if(existing) return existing.id;
  return createNode(x, y, true);
}

function splitSelectedElementsAtIntersections(){
  const elArr = selectedElements();
  if(elArr.length < 2){
    setStatusHint('Zaznacz co najmniej 2 pręty, aby znaleźć ich punkty przecięcia.');
    return;
  }

  // Mapa przecięć dla każdego zaznaczonego pręta: elId -> array of { t, nodeId }
  const cutsMap = new Map();
  elArr.forEach(el => cutsMap.set(el.id, []));

  const EPS = 1e-5;
  const initialNodesCount = nodes.length;

  for(let i = 0; i < elArr.length; i++){
    const el1 = elArr[i];
    const a1 = getNode(el1.n1), b1 = getNode(el1.n2);
    if(!a1 || !b1) continue;
    const v1x = b1.x - a1.x, v1y = b1.y - a1.y;
    const L1sq = v1x * v1x + v1y * v1y;
    if(L1sq < 1e-10) continue;

    for(let j = i + 1; j < elArr.length; j++){
      const el2 = elArr[j];
      const a2 = getNode(el2.n1), b2 = getNode(el2.n2);
      if(!a2 || !b2) continue;
      const v2x = b2.x - a2.x, v2y = b2.y - a2.y;
      const L2sq = v2x * v2x + v2y * v2y;
      if(L2sq < 1e-10) continue;

      const det = v1x * v2y - v1y * v2x;
      const dx = a2.x - a1.x;
      const dy = a2.y - a1.y;

      if(Math.abs(det) > 1e-9){
        // Przecięcie prostych nierównoległych
        const t1 = (dx * v2y - dy * v2x) / det;
        const t2 = (dx * v1y - dy * v1x) / det;

        if(t1 >= -EPS && t1 <= 1 + EPS && t2 >= -EPS && t2 <= 1 + EPS){
          const clampedT1 = Math.max(0, Math.min(1, t1));
          const clampedT2 = Math.max(0, Math.min(1, t2));
          const ix = a1.x + clampedT1 * v1x;
          const iy = a1.y + clampedT1 * v1y;

          const isInternal1 = clampedT1 > EPS && clampedT1 < 1 - EPS;
          const isInternal2 = clampedT2 > EPS && clampedT2 < 1 - EPS;

          if(isInternal1 || isInternal2){
            const nodeId = findOrCreateNodeAt(ix, iy);
            if(isInternal1){
              cutsMap.get(el1.id).push({ t: clampedT1, nodeId });
            }
            if(isInternal2){
              cutsMap.get(el2.id).push({ t: clampedT2, nodeId });
            }
          }
        }
      } else {
        // Równoległe lub współliniowe - sprawdzamy czy węzły końcowe leżą na wnętrzu drugiego odcinka
        const checkEndpointOnSeg = (pt, segEl, segA, segVx, segVy, segLsq) => {
          const projT = ((pt.x - segA.x) * segVx + (pt.y - segA.y) * segVy) / segLsq;
          if(projT > EPS && projT < 1 - EPS){
            const px = segA.x + projT * segVx;
            const py = segA.y + projT * segVy;
            if(Math.hypot(pt.x - px, pt.y - py) < 1e-4){
              const nodeId = findOrCreateNodeAt(pt.x, pt.y);
              cutsMap.get(segEl.id).push({ t: projT, nodeId });
            }
          }
        };
        checkEndpointOnSeg(a2, el1, a1, v1x, v1y, L1sq);
        checkEndpointOnSeg(b2, el1, a1, v1x, v1y, L1sq);
        checkEndpointOnSeg(a1, el2, a2, v2x, v2y, L2sq);
        checkEndpointOnSeg(b1, el2, a2, v2x, v2y, L2sq);
      }
    }
  }

  let totalSplits = 0;
  cutsMap.forEach(cuts => {
    if(cuts.length > 0) totalSplits += cuts.length;
  });

  if(totalSplits === 0){
    setStatusHint('Nie znaleziono punktów przecięcia między zaznaczonymi prętami.');
    return;
  }

  const finalElemIds = [];

  elArr.forEach(el => {
    const rawCuts = cutsMap.get(el.id) || [];
    if(rawCuts.length === 0){
      finalElemIds.push(el.id);
      return;
    }

    rawCuts.sort((a, b) => a.t - b.t);
    const uniqueCuts = [];
    rawCuts.forEach(c => {
      if(!uniqueCuts.some(u => Math.abs(u.t - c.t) < 1e-4 || u.nodeId === c.nodeId)){
        uniqueCuts.push(c);
      }
    });

    if(uniqueCuts.length === 0){
      finalElemIds.push(el.id);
      return;
    }

    const allNodes = [el.n1, ...uniqueCuts.map(c => c.nodeId), el.n2];
    const allT = [0, ...uniqueCuts.map(c => c.t), 1];
    const numSegs = allNodes.length - 1;

    for(let k = 0; k < numSegs; k++){
      const startN = allNodes[k];
      const endN = allNodes[k + 1];
      const t0 = allT[k];
      const t1 = allT[k + 1];

      const newId = createElement(startN, endN);
      if(newId == null) continue;
      const ne = getElement(newId);
      ne.sectionId = el.sectionId;
      ne.materialId = el.materialId;
      ne.hingeStart = (k === 0) ? !!el.hingeStart : false;
      ne.hingeEnd = (k === numSegs - 1) ? !!el.hingeEnd : false;
      if(el.hingeStart && el.momentHingeStart && (k === 0)){
        ne.momentHingeStart = el.momentHingeStart;
      }
      if(el.hingeEnd && el.momentHingeEnd && (k === numSegs - 1)){
        ne.momentHingeEnd = el.momentHingeEnd;
      }
      if(el.thermal){
        ne.thermal = { dTtop: el.thermal.dTtop, dTbottom: el.thermal.dTbottom };
      }
      if(el.q){
        const qAt = (t) => el.q.qStart + (el.q.qEnd - el.q.qStart) * t;
        ne.q = {
          qStart: qAt(t0),
          qEnd: qAt(t1),
          angle: el.q.angle,
          mode: el.q.mode || 'resultant'
        };
      }
      finalElemIds.push(newId);
    }

    deleteElement(el.id);
  });

  const createdNodesCount = nodes.length - initialNodesCount;
  selection = { nodeIds: [], elemIds: finalElemIds };
  invalidateResults();
  renderSidebar();
  render();

  setStatusHint(`Znaleziono przecięcia: podzielono pręty i dodano ${createdNodesCount} ${createdNodesCount === 1 ? 'nowy węzeł' : 'nowe węzły/węzłów'}.`);
}

/* ---- node/element property update handlers ----
   Every handler below reads the *current* selection itself (selectedNodes()/selectedElements())
   rather than taking an id, so the exact same functions serve both single-item editing (panel
   built for a 1-element selection) and bulk editing of a multi-selection (built via the box-select
   tool): editing a field always applies it to every currently selected node/element. */
function updateNodeCoordSel(axis,val){
  const n=selectedNodes()[0];
  if(!n) return;
  n[axis]=parseFloat(val)||0;
  const targetId = checkAndMergeCoincidentNode(n.id);
  if(targetId!=null){
    selection.nodeIds=[targetId];
  }
  invalidateResults(); renderSidebar(); render();
}
function deleteSelectedNodes(){
  selectedNodes().map(n=>n.id).forEach(id=>deleteNode(id));
  selection.nodeIds=[];
  renderSidebar(); render();
}
function bulkApplySupportPreset(key){
  const F=()=>({type:'fixed',delta:0}), Fr=()=>({type:'free'});
  selectedNodes().forEach(n=>{
    if(key==='none'){ n.support=null; return; }
    const angleDeg = n.support? (n.support.angleDeg||0) : 0;
    let ux,uy,rz;
    if(key==='fixed'){ ux=F();uy=F();rz=F(); }
    else if(key==='pin'){ ux=F();uy=F();rz=Fr(); }
    else if(key==='rollerH'){ ux=Fr();uy=F();rz=Fr(); }
    else if(key==='rollerV'){ ux=F();uy=Fr();rz=Fr(); }
    n.support={angleDeg,ux,uy,rz};
  });
  invalidateResults(); renderSidebar(); render();
}
function bulkUpdateSupportAngle(val){
  const v=parseFloat(val)||0;
  selectedNodes().forEach(n=>{ if(!n.support) n.support={angleDeg:0,ux:{type:'free'},uy:{type:'free'},rz:{type:'free'}}; n.support.angleDeg=v; });
  invalidateResults(); renderSidebar(); render();
}
function bulkNudgeSupportAngle(delta){
  selectedNodes().forEach(n=>{ if(!n.support) n.support={angleDeg:0,ux:{type:'free'},uy:{type:'free'},rz:{type:'free'}}; n.support.angleDeg=normalizeAngle((n.support.angleDeg||0)+delta); });
  invalidateResults(); renderSidebar(); render();
}
function bulkUpdateSupportDir(key,field,val){
  selectedNodes().forEach(n=>{
    if(!n.support) n.support={angleDeg:0,ux:{type:'free'},uy:{type:'free'},rz:{type:'free'}};
    if(!n.support[key]) n.support[key]={type:'free'};
    if(field==='type'){
      const old=n.support[key];
      n.support[key]={type:val, k: val==='spring'?(old.k||1000):undefined, delta: old.delta||0};
    } else if(field==='k'){ n.support[key].k=parseFloat(val)||0; }
    else if(field==='delta'){ n.support[key].delta=parseFloat(val)||0; }
  });
  invalidateResults(); renderSidebar(); render();
}
function bulkToggleNodeForce(checked){
  selectedNodes().forEach(n=>{ n.force = checked? (n.force||{mode:'polar', F:10, angle:270}) : null; });
  invalidateResults(); renderSidebar(); render();
}
function bulkSetForceMode(mode){
  selectedNodes().forEach(n=>{
    if(!n.force){ n.force={mode:'polar', F:10, angle:270}; }
    const curMode = n.force.mode||'polar';
    if(curMode===mode) return;
    const {Fx,Fy}=forceComponents(n.force);
    if(mode==='components'){
      n.force = {mode:'components', Fx:Math.round(Fx*1000)/1000, Fy:Math.round(Fy*1000)/1000};
    } else {
      const F=Math.hypot(Fx,Fy);
      let angle = F>1e-9 ? Math.atan2(Fy,Fx)*180/Math.PI : (n.force.angle||270);
      if(angle<0) angle+=360;
      n.force = {mode:'polar', F:Math.round(F*1000)/1000, angle:Math.round(angle*100)/100};
    }
  });
  invalidateResults(); renderSidebar(); render();
}
function bulkUpdateNodeForce(field,val){
  const v=parseFloat(val)||0;
  selectedNodes().forEach(n=>{ if(!n.force) n.force={mode:'polar', F:10, angle:270}; n.force[field]=v; });
  invalidateResults(); renderSidebar(); render();
}
function bulkSetForceAngle(ang){
  selectedNodes().forEach(n=>{ if(!n.force) n.force={mode:'polar', F:10, angle:270}; n.force.angle=ang; });

}
function bulkNudgeForceAngle(delta){
  selectedNodes().forEach(n=>{ if(!n.force) n.force={mode:'polar', F:10, angle:270}; n.force.angle=normalizeAngle((n.force.angle||0)+delta); });

}
function bulkToggleNodeMoment(checked){

function bulkUpdateNodeMoment(val){

function bulkSetQPerp(){

function panelResults(){
  if(solveWarning && !solved){
    return `<div class="panel"><h3>Wyniki</h3><div class="warn">${solveWarning}</div>
      <button class="primary-btn" onclick="runAnalysis()">Uruchom obliczenia</button></div>`;
  }
  if(!solved){
    return `<div class="panel"><h3>Wyniki</h3><div class="empty-state">Zbuduj model i kliknij <b>OBLICZ</b> w górnym pasku,<br>aby zobaczyć odkształcenia, wykresy M/T/N i naprężenia.</div></div>`;
  }
  if(solved.type === 'stability'){
    return panelStabilityResults();
  }
  if(solved.type === 'modal'){
    return panelModalResults();
  }
  if(solved.type === 'harmonic'){
    return panelHarmonicResults();
  }
  if(solved.type === 'influence'){
    return panelInfluenceResults();
  }
  if(solved.type === 'envelope'){
    return panelEnvelopeResults();
  }
  let html = `<div class="panel"><h3>Reakcje <span class="tag">rozwiązano</span></h3>`;
  if(solveWarning) html += `<div class="warn">${solveWarning}</div>`;
  html += reactionsTableHtml();
  html += `</div>`;
  html += diagramTogglesHtml();
  html += probePanelHtml();
  return html;
}

function reactionsTableHtml(){
  const supNodes = nodes.filter(n=>n.support);

  supNodes.forEach(n=>{
    const idx=solved.nodeIndex[n.id];
    const Rx=solved.Rglobal[3*idx], Ry=solved.Rglobal[3*idx+1], Rm=solved.Rglobal[3*idx+2];
    rows+=`<tr><td>W${n.id}</td><td>${fmtSmart(Rx)}</td><td>${fmtSmart(Ry)}</td><td>${fmtSmart(Rm)}</td></tr>`;
  });
  return `<table class="rtab"><thead><tr><th>Węzeł</th><th>Rx [kN]</th><th>Ry [kN]</th><th>M [kNm]</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function probePanelHtml(){
  if(elements.length===0) return '';
  if(probe.elId==null || !getElement(probe.elId)) probe.elId=elements[0].id;
  const el=getElement(probe.elId);
  const L=elLength(el);
  const options = elements.map(e=>`<option value="${e.id}" ${e.id===probe.elId?'selected':''}>P${e.id} (W${e.n1}→W${e.n2})</option>`).join('');
  const isInfluence = solved && solved.type==='influence';
  const isEnvelope = solved && solved.type==='envelope';
  const hasData = isEnvelope ? (solved.envelopeData && !!solved.envelopeData[probe.elId]) : (isInfluence ? (ilDiagrams && !!ilDg(probe.elId)) : (diagrams && !!diagrams[probe.elId]));
  const readoutHtml = hasData ? probeReadoutHtml() : '<div class="muted">Uruchom obliczenia, aby odczytać dokładne wyniki.</div>';
  return `<div class="panel"><h3>Sonda wyników <span class="tag">dokładny odczyt</span></h3>
    <div class="row"><label>Pręt</label><select id="probeElSel" onchange="setProbeElement(parseInt(this.value))">${options}</select></div>
    <div class="row"><label>Pozycja x</label><input type="range" id="probeSlider" min="0" max="100" step="0.5" value="${probe.t*100}" oninput="setProbeT(this.value/100)"><span class="unit" id="probeXLbl" style="width:56px;">${fmt(probe.t*L,2)} m</span></div>
    <div id="probeReadout">${readoutHtml}</div>
    <div class="muted" style="margin-top:6px;">Wskazówka: kliknij bezpośrednio na pręt na rysunku (tryb „Zaznacz”), aby ustawić sondę w wybranym miejscu.</div>
  </div>`;
}
function probeReadoutHtml(){
  const idx = elements.findIndex(e=>e.id===probe.elId);

  if(solved.type === 'envelope'){
    const env = solved.envelopeData && solved.envelopeData[probe.elId];
    if(!env) return '<div class="muted">Brak danych obwiedni dla tego pręta.</div>';
    const x = probe.t * env.L;
    const pts = env.pts;
    const nSeg = pts.length - 1;
    const s = Math.max(0, Math.min(nSeg, probe.t * nSeg));
    const i0 = Math.floor(s);
    const i1 = Math.min(nSeg, i0 + 1);
    const frac = s - i0;
    const p0 = pts[i0], p1 = pts[i1];

    const lerp = (a, b) => a + (b - a) * frac;
    const M_max = lerp(p0.M_max, p1.M_max);
    const M_min = lerp(p0.M_min, p1.M_min);
    const V_max = lerp(p0.V_max, p1.V_max);
    const V_min = lerp(p0.V_min, p1.V_min);
    const N_max = lerp(p0.N_max, p1.N_max);
    const N_min = lerp(p0.N_min, p1.N_min);
    const sigTop_max = lerp(p0.sigTop_max, p1.sigTop_max) / 1000;
    const sigTop_min = lerp(p0.sigTop_min, p1.sigTop_min) / 1000;
    const sigBot_max = lerp(p0.sigBot_max, p1.sigBot_max) / 1000;
    const sigBot_min = lerp(p0.sigBot_min, p1.sigBot_min) / 1000;

    return `
    <div style="display:flex;justify-content:space-between;margin:6px 0 4px 0;font-size:11.5px;color:var(--text-dim);">
      <span>Pozycja x: <strong style="color:var(--text);font-family:var(--mono);">${fmt(x,3)} m</strong></span>
      <span>Długość L: <strong style="color:var(--text);font-family:var(--mono);">${fmt(env.L,3)} m</strong></span>
    </div>
    <table class="probetable">
      <thead>
        <tr>
          <th>Wielkość</th>
          <th style="color:var(--text);text-align:right;">Maks.</th>
          <th style="color:var(--text);text-align:right;">Min.</th>
          <th style="color:var(--text-dim);text-align:right;">Rozpiętość Δ</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><span class="swatch" style="background:var(--m-color);"></span><strong>M</strong> <span class="muted">[kNm]</span></td>
          <td style="color:var(--m-color);font-weight:600;">${fmt(M_max,3)}</td>
          <td style="color:var(--m-color);font-weight:600;">${fmt(M_min,3)}</td>
          <td>${fmt(M_max - M_min,3)}</td>
        </tr>
        <tr>
          <td><span class="swatch" style="background:var(--t-color);"></span><strong>T</strong> <span class="muted">[kN]</span></td>
          <td style="color:var(--t-color);font-weight:600;">${fmt(V_max,3)}</td>
          <td style="color:var(--t-color);font-weight:600;">${fmt(V_min,3)}</td>
          <td>${fmt(V_max - V_min,3)}</td>
        </tr>
        <tr>
          <td><span class="swatch" style="background:var(--n-color);"></span><strong>N</strong> <span class="muted">[kN]</span></td>
          <td style="color:var(--n-color);font-weight:600;">${fmt(N_max,3)}</td>
          <td style="color:var(--n-color);font-weight:600;">${fmt(N_min,3)}</td>
          <td>${fmt(N_max - N_min,3)}</td>
        </tr>
        <tr>
          <td><span class="swatch" style="background:var(--s-color);"></span><strong>σ góra</strong> <span class="muted">[MPa]</span></td>
          <td>${fmt(sigTop_max,2)}</td>
          <td>${fmt(sigTop_min,2)}</td>
          <td>${fmt(sigTop_max - sigTop_min,2)}</td>
        </tr>
        <tr>
          <td><span class="swatch" style="background:var(--s-color);"></span><strong>σ dół</strong> <span class="muted">[MPa]</span></td>
          <td>${fmt(sigBot_max,2)}</td>
          <td>${fmt(sigBot_min,2)}</td>
          <td>${fmt(sigBot_max - sigBot_min,2)}</td>
        </tr>
      </tbody>
    </table>`;
  }

  if(solved.type === 'influence'){
    const dg = ilDg(probe.elId);
    const x = probe.t*dg.L;
    const prN = FEM.pointResults(solved.byType.N.results[idx], x);
    const prT = FEM.pointResults(solved.byType.T.results[idx], x);
    const prM = FEM.pointResults(solved.byType.M.results[idx], x);
    return `<div class="probeval">
      <div><span class="k">x wzdłuż pręta</span><span class="v">${fmt(x,3)} m</span></div>
      <div><span class="k">Długość pręta</span><span class="v">${fmt(dg.L,3)} m</span></div>
      <div><span class="k">&nbsp;</span><span class="v">&nbsp;</span></div>
      <div><span class="k">Rzędna l.w. N (—)</span><span class="v">${fmt(prN.v_local,4)}</span></div>
      <div><span class="k">Rzędna l.w. T (—)</span><span class="v">${fmt(prT.v_local,4)}</span></div>
      <div><span class="k">Rzędna l.w. M (m)</span><span class="v">${fmt(prM.v_local,4)}</span></div>
    </div>`;
  }

  const dg=diagrams[probe.elId]; const x=probe.t*dg.L;

  if(solved.type === 'stability'){
    const mode = solved.modes[solved.currentMode || 0];
    const staticEdRes = solved.staticSolved.results[idx];
    const staticPr = FEM.pointResults(staticEdRes, x);
    const rawPr = mode.evalPoint(idx, x, staticPr);
    const sign = (solved.modalSign != null) ? solved.modalSign : 1;
    const pr = {
      ...rawPr,
      N: rawPr.N * sign,
      V: rawPr.V * sign,
      M: rawPr.M * sign,
      u_local: rawPr.u_local * sign,
      v_local: rawPr.v_local * sign,
      theta: rawPr.theta * sign,
      Ux_global: rawPr.Ux_global * sign,
      Uy_global: rawPr.Uy_global * sign,
      sigTop: rawPr.sigTop * sign,
      sigBot: rawPr.sigBot * sign
    };
    return `<div class="probeval">
      <div><span class="k">x wzdłuż pręta</span><span class="v">${fmt(x,3)} m</span></div>
      <div><span class="k">Długość pręta</span><span class="v">${fmt(dg.L,3)} m</span></div>
      <div><span class="k">Ux modalne (znormaliz.)</span><span class="v">${fmt(pr.Ux_global,3)}</span></div>
      <div><span class="k">Uy modalne (znormaliz.)</span><span class="v">${fmt(pr.Uy_global,3)}</span></div>
      <div><span class="k">u lokalne (osiowe)</span><span class="v">${fmt(pr.u_local,3)}</span></div>
      <div><span class="k">v lokalne (poprzeczne)</span><span class="v">${fmt(pr.v_local,3)}</span></div>
      <div><span class="k">Obrót θ modalny</span><span class="v">${fmt(pr.theta,3)}</span></div>
      <div><span class="k">&nbsp;</span><span class="v">&nbsp;</span></div>
      <div><span class="k">Siła osiowa N_cr</span><span class="v">${fmt(pr.N,3)} kN</span></div>
      <div><span class="k">Siła tnąca T_cr</span><span class="v">${fmt(pr.V,3)} kN</span></div>
      <div><span class="k">Moment zginający M_cr</span><span class="v">${fmt(pr.M,3)} kNm</span></div>
      <div><span class="k">&nbsp;</span><span class="v">&nbsp;</span></div>
      <div><span class="k">Naprężenie σ_cr góra</span><span class="v">${fmt(pr.sigTop/1000,2)} MPa</span></div>
      <div><span class="k">Naprężenie σ_cr dół</span><span class="v">${fmt(pr.sigBot/1000,2)} MPa</span></div>
    </div>`;
  }

  if(solved.type === 'modal'){
    const mode = solved.modes[solved.currentMode || 0];
    const rawPr = mode.evalPoint(idx, x);
    const sign = (solved.modalSign != null) ? solved.modalSign : 1;
    const pr = {
      ...rawPr,
      N: rawPr.N * sign,
      V: rawPr.V * sign,
      M: rawPr.M * sign,
      u_local: rawPr.u_local * sign,
      v_local: rawPr.v_local * sign,
      theta: rawPr.theta * sign,
      Ux_global: rawPr.Ux_global * sign,
      Uy_global: rawPr.Uy_global * sign,
      sigTop: rawPr.sigTop * sign,
      sigBot: rawPr.sigBot * sign
    };
    return `<div class="probeval">
      <div><span class="k">x wzdłuż pręta</span><span class="v">${fmt(x,3)} m</span></div>
      <div><span class="k">Długość pręta</span><span class="v">${fmt(dg.L,3)} m</span></div>
      <div><span class="k">Ux modalne (znormaliz.)</span><span class="v">${fmt(pr.Ux_global,3)}</span></div>
      <div><span class="k">Uy modalne (znormaliz.)</span><span class="v">${fmt(pr.Uy_global,3)}</span></div>
      <div><span class="k">u lokalne (osiowe)</span><span class="v">${fmt(pr.u_local,3)}</span></div>
      <div><span class="k">v lokalne (poprzeczne)</span><span class="v">${fmt(pr.v_local,3)}</span></div>
      <div><span class="k">Obrót θ modalny</span><span class="v">${fmt(pr.theta,3)}</span></div>
      <div><span class="k">&nbsp;</span><span class="v">&nbsp;</span></div>
      <div><span class="k">Siła osiowa N_mod</span><span class="v">${fmt(pr.N,3)} kN</span></div>
      <div><span class="k">Siła tnąca T_mod</span><span class="v">${fmt(pr.V,3)} kN</span></div>
      <div><span class="k">Moment zginający M_mod</span><span class="v">${fmt(pr.M,3)} kNm</span></div>
      <div><span class="k">&nbsp;</span><span class="v">&nbsp;</span></div>
      <div><span class="k">Naprężenie σ_mod góra</span><span class="v">${fmt(pr.sigTop/1000,2)} MPa</span></div>
      <div><span class="k">Naprężenie σ_mod dół</span><span class="v">${fmt(pr.sigBot/1000,2)} MPa</span></div>
    </div>`;
  }

  if(solved.type === 'harmonic'){
    const staticEdRes = solved.staticSol ? solved.staticSol.results[idx] : null;
    const dynEdRes = solved.dynSol ? solved.dynSol.results[idx] : null;
    const gravEdRes = solved.gravSol ? solved.gravSol.results[idx] : null;

    const prStat = staticEdRes ? FEM.pointResults(staticEdRes, x) : { N:0, V:0, M:0, u_local:0, v_local:0, theta:0, Ux_global:0, Uy_global:0, sigTop:0, sigBot:0 };
    const prHarm = dynEdRes ? FEM.pointResults(dynEdRes, x) : { N:0, V:0, M:0, u_local:0, v_local:0, theta:0, Ux_global:0, Uy_global:0, sigTop:0, sigBot:0 };
    const prGrav = gravEdRes ? FEM.pointResults(gravEdRes, x) : null;

    const cfg = HARMONIC_COMBS[solved.combKey || 'stat_plus_dyn'] || HARMONIC_COMBS['stat_plus_dyn'];
    const sStat = cfg.sStat, sInertia = cfg.sInertia, sGrav = cfg.sGrav;

    function combVal(key){
      const vStat = prStat[key] || 0;
      const vHarm = prHarm[key] || 0;
      const vInert = vHarm - vStat;
      const vGrav = (sGrav && prGrav) ? (prGrav[key] || 0) : 0;
      return sStat * vStat + sInertia * vInert + vGrav;
    }

    const pr = {
      x,
      N: combVal('N'),
      V: combVal('V'),
      M: combVal('M'),
      u_local: combVal('u_local'),
      v_local: combVal('v_local'),
      theta: combVal('theta'),
      Ux_global: combVal('Ux_global'),
      Uy_global: combVal('Uy_global'),
      sigTop: combVal('sigTop'),
      sigBot: combVal('sigBot')
    };

    return `<div class="probeval">
      <div><span class="k">x wzdłuż pręta</span><span class="v">${fmt(x,3)} m</span></div>
      <div><span class="k">Długość pręta</span><span class="v">${fmt(dg.L,3)} m</span></div>
      <div><span class="k">Ux (${cfg.shortName})</span><span class="v">${fmt(pr.Ux_global*1000,2)} mm</span></div>
      <div><span class="k">Uy (${cfg.shortName})</span><span class="v">${fmt(pr.Uy_global*1000,2)} mm</span></div>
      <div><span class="k">u (lokalne, osiowe)</span><span class="v">${fmt(pr.u_local*1000,2)} mm</span></div>
      <div><span class="k">v (lokalne, poprzeczne)</span><span class="v">${fmt(pr.v_local*1000,2)} mm</span></div>
      <div><span class="k">Obrót θ</span><span class="v">${fmt(pr.theta*1000,3)} mrad</span></div>
      <div><span class="k">&nbsp;</span><span class="v">&nbsp;</span></div>
      <div><span class="k">Siła osiowa N</span><span class="v">${fmt(pr.N,3)} kN</span></div>
      <div><span class="k">Siła tnąca T</span><span class="v">${fmt(pr.V,3)} kN</span></div>
      <div><span class="k">Moment zginający M</span><span class="v">${fmt(pr.M,3)} kNm</span></div>
      <div><span class="k">&nbsp;</span><span class="v">&nbsp;</span></div>
      <div><span class="k">Naprężenie σ góra</span><span class="v">${fmt(pr.sigTop/1000,2)} MPa</span></div>
      <div><span class="k">Naprężenie σ dół</span><span class="v">${fmt(pr.sigBot/1000,2)} MPa</span></div>
    </div>`;
  }

  const edRes = solved.results[idx];
  const pr = FEM.pointResults(edRes,x);
  return `<div class="probeval">
    <div><span class="k">x wzdłuż pręta</span><span class="v">${fmt(x,3)} m</span></div>
    <div><span class="k">Długość pręta</span><span class="v">${fmt(dg.L,3)} m</span></div>
    <div><span class="k">Ux (globalne)</span><span class="v">${fmt(pr.Ux_global*1000,2)} mm</span></div>
    <div><span class="k">Uy (globalne)</span><span class="v">${fmt(pr.Uy_global*1000,2)} mm</span></div>
    <div><span class="k">u (lokalne, osiowe)</span><span class="v">${fmt(pr.u_local*1000,2)} mm</span></div>
    <div><span class="k">v (lokalne, poprzeczne)</span><span class="v">${fmt(pr.v_local*1000,2)} mm</span></div>
    <div><span class="k">Obrót θ</span><span class="v">${fmt(pr.theta*1000,3)} mrad</span></div>
    <div><span class="k">&nbsp;</span><span class="v">&nbsp;</span></div>
    <div><span class="k">Siła osiowa N</span><span class="v">${fmt(pr.N,3)} kN</span></div>
    <div><span class="k">Siła tnąca T</span><span class="v">${fmt(pr.V,3)} kN</span></div>
    <div><span class="k">Moment zginający M</span><span class="v">${fmt(pr.M,3)} kNm</span></div>
    <div><span class="k">&nbsp;</span><span class="v">&nbsp;</span></div>
    <div><span class="k">Naprężenie σ góra</span><span class="v">${fmt(pr.sigTop/1000,2)} MPa</span></div>
    <div><span class="k">Naprężenie σ dół</span><span class="v">${fmt(pr.sigBot/1000,2)} MPa</span></div>
  </div>`;
}
function setProbeElement(id){ probe.elId=id; probe.t=0.5; renderSidebar(); render(); }
function setProbeT(t){
  probe.t=Math.max(0,Math.min(1,parseFloat(t)));
  const isInfluence = solved && solved.type==='influence';
  const isEnvelope = solved && solved.type==='envelope';
  const dg = isEnvelope ? (solved.envelopeData && solved.envelopeData[probe.elId]) : (isInfluence ? ilDg(probe.elId) : (diagrams? diagrams[probe.elId] : null));
  const L = dg? dg.L : elLength(getElement(probe.elId));
  const lbl=document.getElementById('probeXLbl'); if(lbl) lbl.textContent=fmt(probe.t*L,2)+' m';
  const ro=document.getElementById('probeReadout');
  if(ro && dg) ro.innerHTML=probeReadoutHtml();
  render();
}

function addMaterial(){
  const name=document.getElementById('newMatName').value||'Materiał';
  const E=parseFloat(document.getElementById('newMatE').value)||1;
  const alpha=parseFloat(document.getElementById('newMatAlpha').value)||0;
  const density=parseFloat(document.getElementById('newMatDensity').value)||0;
  const id=nextMatId++;
  materials.push({id,name,E,alpha,density});
  addMatFormOpen=false; renderSidebar(); buildToolbar();
}
function removeMaterial(id){
  if(elements.some(e=>e.materialId===id)){ setStatusHint('Nie można usunąć — materiał jest przypisany do pręta.'); return; }
  if(materials.length<=1) return;
  materials=materials.filter(m=>m.id!==id);
  if(defaultMaterialId===id) defaultMaterialId=materials[0].id;
  renderSidebar(); buildToolbar();
}

   a potem rozmiaru z tablicy.

function catalogSizeLabel(kind,t){
  return kind==='angle' ? t.name : `${t.name} (h=${t.h}×b=${t.b} cm)`;
}
function catalogFieldsHtml(){
  const catType=newSecCatalogTypeState, def=CATALOG_DEFS[catType];
  const showMirror = (def.kind==='tee' || def.kind==='angle');
  return `<div class="row"><label>Profil</label><select id="newSecCatType" onchange="onCatalogTypeChange()">
      ${CATALOG_ORDER.map(k=>`<option value="${k}" ${k===catType?'selected':''}>${CATALOG_DEFS[k].label}</option>`).join('')}
    </select></div>
    <div class="row"><label>Rozmiar</label><select id="newSecCatSize" onchange="onCatalogSizeChange()">
      ${def.data.map((t,i)=>`<option value="${i}">${catalogSizeLabel(def.kind,t)}</option>`).join('')}
    </select></div>
    ${showMirror? `<div class="checkline"><input type="checkbox" id="newSecCatMirror" onchange="onCatalogSizeChange()"> Odwrócony</div>
    <div class="muted">Przekrój niesymetryczny — zaznacz, aby odwrócić orientację względem osi pręta.</div>` : ''}
    <div id="newSecPreview"></div>`;
}
function onCatalogTypeChange(){
  newSecCatalogTypeState=document.getElementById('newSecCatType').value;
  document.getElementById('newSecSubFields').innerHTML=catalogFieldsHtml();
  refreshSecName(); updateSecPreview();
}
function onCatalogSizeChange(){ refreshSecName(); updateSecPreview(); }
function refreshSecName(){
  const nameInput=document.getElementById('newSecName');
  if(!nameInput || newSecCategoryState!=='katalog') return;
  const def=CATALOG_DEFS[newSecCatalogTypeState];
  const sizeSel=document.getElementById('newSecCatSize'); if(!sizeSel) return;
  const idx=parseInt(sizeSel.value)||0;
  const mirrorEl=document.getElementById('newSecCatMirror');
  const mirror = mirrorEl? mirrorEl.checked : false;
  nameInput.value = def.data[idx].name + (mirror? ' (odwrócony)':'');
}
function computeCatalogGeom(){
  const catType=newSecCatalogTypeState, def=CATALOG_DEFS[catType];
  const idx=parseInt(document.getElementById('newSecCatSize').value)||0;
  const t=def.data[idx];
  const mirrorEl=document.getElementById('newSecCatMirror');
  const mirror = mirrorEl? mirrorEl.checked : false;
  if(def.kind==='sym'){
    return {A:t.A,I:t.Ix,h:t.h,cTop:t.h/2,cBot:t.h/2,bw:t.b,
      extra:{catType,catIdx:idx,catalog:t.name,drawKind:def.draw,tf:t.tf,tw:t.tw}};
  }
  if(def.kind==='tee'){
    const e1=t.Ix/t.Wx1, e2=t.Ix/t.Wx2; // e1: bliżej stopki, e2: bliżej końca środnika
    const cTop = mirror? e2 : e1, cBot = mirror? e1 : e2;
    return {A:t.A,I:t.Ix,h:t.h,cTop,cBot,bw:t.b,
      extra:{catType,catIdx:idx,catalog:t.name,mirrored:mirror,drawKind:def.draw,tf:t.s,tw:t.s}};
  }
  // kątownik (angle)
  const cTop = mirror? t.zs : (t.h-t.zs), cBot = mirror? (t.h-t.zs) : t.zs;
  return {A:t.A,I:t.Ix,h:t.h,cTop,cBot,bw:t.h,
    extra:{catType,catIdx:idx,catalog:t.name,mirrored:mirror,drawKind:def.draw,t:t.t}};
}

    <div class="row"><label>Grubość ścianki t</label><input type="number" step="0.1" id="newSecPipeT" value="0.8" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div id="newSecPreview"></div>`;
  if(shape==='box') return `<div class="row"><label>Wys. zewn. H</label><input type="number" step="0.5" id="newSecBoxH" value="20" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Szer. zewn. B</label><input type="number" step="0.5" id="newSecBoxB" value="12" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Grubość ścianki t</label><input type="number" step="0.1" id="newSecBoxT" value="0.6" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="muted">Grubość jednakowa na wszystkich ściankach.</div>
    <div id="newSecPreview"></div>`;
  if(shape==='ibeam') return `<div class="row"><label>Wysokość h</label><input type="number" step="0.5" id="newSecIH" value="20" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Szerokość b</label><input type="number" step="0.5" id="newSecIB" value="12" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Grub. stopki tf</label><input type="number" step="0.1" id="newSecITf" value="1.0" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Grub. środnika tw</label><input type="number" step="0.1" id="newSecITw" value="0.7" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="muted">Przekrój symetryczny (dwuteownik) — stopki jednakowe u góry i u dołu.</div>
    <div id="newSecPreview"></div>`;
  if(shape==='tee') return `<div class="row"><label>Wysokość h</label><input type="number" step="0.5" id="newSecTH" value="10" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Szerokość stopki b</label><input type="number" step="0.5" id="newSecTB" value="10" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Grub. stopki tf</label><input type="number" step="0.1" id="newSecTTf" value="1.0" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Grub. środnika tw</label><input type="number" step="0.1" id="newSecTTw" value="1.0" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="checkline"><input type="checkbox" id="newSecTMirror" onchange="updateSecPreview()"> Odwrócony (stopka na dole)</div>
    <div class="muted">Przekrój niesymetryczny — środek ciężkości bliżej stopki.</div>
    <div id="newSecPreview"></div>`;
  if(shape==='angle') return `<div class="row"><label>Dł. ramienia a</label><input type="number" step="0.5" id="newSecAA" value="8" onchange="updateSecPreview()"><span class="unit">cm</span></div>

  return '';
}

function computeShapeGeom(shape){
  if(shape==='rect'){
    const b=parseFloat(document.getElementById('newSecB').value)||1, hh=parseFloat(document.getElementById('newSecH').value)||1;
    const A=b*hh, I=b*Math.pow(hh,3)/12;
    return {A,I,h:hh,cTop:hh/2,cBot:hh/2,bw:b,extra:{b,hh,drawKind:'rect'}};
  }
  if(shape==='circ'){
    const d=parseFloat(document.getElementById('newSecD').value)||1;
    const A=Math.PI*d*d/4, I=Math.PI*Math.pow(d,4)/64;
    return {A,I,h:d,cTop:d/2,cBot:d/2,bw:d,extra:{d,drawKind:'circle'}};
  }
  if(shape==='pipe'){
    const D=Math.max(parseFloat(document.getElementById('newSecPipeD').value)||1, 0.2);
    const t=Math.max(0.05, Math.min(parseFloat(document.getElementById('newSecPipeT').value)||0.1, D/2-0.05));
    const Di=D-2*t;
    const A=Math.PI/4*(D*D-Di*Di), I=Math.PI/64*(Math.pow(D,4)-Math.pow(Di,4));
    return {A,I,h:D,cTop:D/2,cBot:D/2,bw:D,extra:{D,t,drawKind:'ring'}};
  }
  if(shape==='box'){
    const H=Math.max(parseFloat(document.getElementById('newSecBoxH').value)||1, 0.2);
    const B=Math.max(parseFloat(document.getElementById('newSecBoxB').value)||1, 0.2);
    const t=Math.max(0.05, Math.min(parseFloat(document.getElementById('newSecBoxT').value)||0.1, Math.min(H,B)/2-0.05));
    const Hi=H-2*t, Bi=B-2*t;
    const A=B*H-Bi*Hi, I=(B*Math.pow(H,3)-Bi*Math.pow(Hi,3))/12;
    return {A,I,h:H,cTop:H/2,cBot:H/2,bw:B,extra:{B,H,t,drawKind:'tube'}};
  }
  if(shape==='ibeam'){
    const h=Math.max(parseFloat(document.getElementById('newSecIH').value)||1, 0.2);
    const b=Math.max(parseFloat(document.getElementById('newSecIB').value)||1, 0.2);
    const tf=Math.max(0.05, Math.min(parseFloat(document.getElementById('newSecITf').value)||0.1, h/2-0.05));
    const tw=Math.max(0.05, Math.min(parseFloat(document.getElementById('newSecITw').value)||0.1, b-0.05));
    const A=2*b*tf + tw*(h-2*tf);
    const I=(b*Math.pow(h,3) - (b-tw)*Math.pow(h-2*tf,3))/12;
    return {A,I,h,cTop:h/2,cBot:h/2,bw:b,extra:{tf,tw,drawKind:'ibeam'}};
  }
  if(shape==='tee'){
    const h=Math.max(parseFloat(document.getElementById('newSecTH').value)||1, 0.2);
    const b=Math.max(parseFloat(document.getElementById('newSecTB').value)||1, 0.2);
    const tf=Math.max(0.05, Math.min(parseFloat(document.getElementById('newSecTTf').value)||0.1, h-0.05));
    const tw=Math.max(0.05, Math.min(parseFloat(document.getElementById('newSecTTw').value)||0.1, b-0.05));
    const mirror=document.getElementById('newSecTMirror').checked;
    const A1=b*tf, y1=h-tf/2;
    const A2=tw*(h-tf), y2=(h-tf)/2;
    const A=A1+A2;
    const ybar=(A1*y1+A2*y2)/A;
    const I1=b*Math.pow(tf,3)/12 + A1*Math.pow(y1-ybar,2);
    const I2=tw*Math.pow(h-tf,3)/12 + A2*Math.pow(y2-ybar,2);
    const I=I1+I2;
    const cTopRaw=h-ybar, cBotRaw=ybar; // domyślnie: stopka u góry (blisko centroidu)
    const cTop = mirror? cBotRaw : cTopRaw, cBot = mirror? cTopRaw : cBotRaw;
    return {A,I,h,cTop,cBot,bw:b,extra:{tf,tw,mirrored:mirror,drawKind:'tee'}};
  }
  // kątownik (angle) — parametryczny
  const a=Math.max(parseFloat(document.getElementById('newSecAA').value)||1, 0.2);
  const t=Math.max(0.05, Math.min(parseFloat(document.getElementById('newSecAT').value)||0.1, a/2-0.02));
  const mirror=document.getElementById('newSecAMirror').checked;
  const A=2*a*t - t*t;
  const ybar=(t/2)*(a*a + a*t - t*t)/A; // odległość środka ciężkości od naroża ramion
  const Ivert=t*Math.pow(a,3)/12 + t*a*Math.pow(a/2-ybar,2);
  const Ihoriz=(a-t)*Math.pow(t,3)/12 + (a-t)*t*Math.pow(t/2-ybar,2);
  const I=Ivert+Ihoriz;
  const cBotRaw=ybar, cTopRaw=a-ybar; // domyślnie: ramię poziome u dołu, blisko naroża
  const cTop = mirror? cBotRaw : cTopRaw, cBot = mirror? cTopRaw : cBotRaw;
  return {A,I,h:a,cTop,cBot,bw:a,extra:{t,mirrored:mirror,drawKind:'angle'}};
}

/* =========================================================================
   Kategoria 3: WŁASNY — wszystkie parametry wprowadzane ręcznie.
   ========================================================================= */
function computeCustomGeom(){
  const A=parseFloat(document.getElementById('newSecA').value)||1;
  const I=parseFloat(document.getElementById('newSecI').value)||1;
  const cTop=parseFloat(document.getElementById('newSecEtop').value)||1;
  const cBot=parseFloat(document.getElementById('newSecEbot').value)||1;
  return {A,I,h:cTop+cBot,cTop,cBot,bw:Math.max(cTop+cBot,1)*0.6,extra:{drawKind:'custom'}};
}

/* ---- mały schematyczny SVG: kontur + kreskowana linia środka ciężkości + wymiary e_góra/e_dół ---- */
function renderSectionSvg(g){
  const VB_W=210, VB_H=150, padL=14, padR=64, padT=14, padB=14;
  const areaW=VB_W-padL-padR, areaH=VB_H-padT-padB;
  const ex=g.extra||{};
  const drawKind=ex.drawKind||'rect';
  let mode='rects', rects=null, bw=g.bw||1, H=(g.cTop+g.cBot)||1;
  if(drawKind==='rect'){ rects=[{x:0,y:0,w:ex.b,h:ex.hh}]; }
  else if(drawKind==='circle'){ mode='circle'; }
  else if(drawKind==='ring'){ mode='ring'; }
  else if(drawKind==='tube'){ mode='tube'; }
  else if(drawKind==='ibeam'){
    const tf=ex.tf, tw=ex.tw;
    rects=[{x:0,y:0,w:bw,h:tf},{x:(bw-tw)/2,y:tf,w:tw,h:H-2*tf},{x:0,y:H-tf,w:bw,h:tf}];
  } else if(drawKind==='channel'){
    const tf=ex.tf, tw=ex.tw;
    rects=[{x:0,y:0,w:tw,h:H},{x:0,y:0,w:bw,h:tf},{x:0,y:H-tf,w:bw,h:tf}];
  } else if(drawKind==='tee'){
    const tf=ex.tf, tw=ex.tw;
    rects = ex.mirrored?
      [{x:(bw-tw)/2,y:0,w:tw,h:H-tf},{x:0,y:H-tf,w:bw,h:tf}] :
      [{x:0,y:0,w:bw,h:tf},{x:(bw-tw)/2,y:tf,w:tw,h:H-tf}];
  } else if(drawKind==='angle'){
    const t=ex.t;
    rects = ex.mirrored?
      [{x:0,y:0,w:t,h:H},{x:0,y:0,w:bw,h:t}] :
      [{x:0,y:0,w:t,h:H},{x:0,y:H-t,w:bw,h:t}];
  } else { rects=[{x:0,y:0,w:bw,h:H}]; } // custom: generic box
  const scale=Math.max(0.1, Math.min(areaW/bw, areaH/H));
  const dw=bw*scale, dh=H*scale;
  const x0=padL+(areaW-dw)/2, y0=padT+(areaH-dh)/2;
  const toX=x=>(x0+x*scale).toFixed(1), toY=y=>(y0+y*scale).toFixed(1);
  const FILL='var(--accent-soft)', STROKE='var(--accent-dark)';
  let shapeSvg='';
  if(mode==='rects'){
    shapeSvg=rects.map(r=>`<rect x="${toX(r.x)}" y="${toY(r.y)}" width="${(r.w*scale).toFixed(1)}" height="${(r.h*scale).toFixed(1)}" fill="${FILL}" stroke="${STROKE}" stroke-width="1.4"/>`).join('');
  } else if(mode==='circle'){
    shapeSvg=`<circle cx="${(x0+dw/2).toFixed(1)}" cy="${(y0+dh/2).toFixed(1)}" r="${(dw/2).toFixed(1)}" fill="${FILL}" stroke="${STROKE}" stroke-width="1.4"/>`;
  } else if(mode==='ring'){
    const cx=x0+dw/2, cy=y0+dh/2, rOut=dw/2, t=(ex.t||0)*scale, rIn=Math.max(rOut-t,1);
    shapeSvg=`<path fill-rule="evenodd" d="M${(cx-rOut).toFixed(1)},${cy.toFixed(1)} a${rOut.toFixed(1)},${rOut.toFixed(1)} 0 1,0 ${(2*rOut).toFixed(1)},0 a${rOut.toFixed(1)},${rOut.toFixed(1)} 0 1,0 ${(-2*rOut).toFixed(1)},0 Z M${(cx-rIn).toFixed(1)},${cy.toFixed(1)} a${rIn.toFixed(1)},${rIn.toFixed(1)} 0 1,1 ${(2*rIn).toFixed(1)},0 a${rIn.toFixed(1)},${rIn.toFixed(1)} 0 1,1 ${(-2*rIn).toFixed(1)},0 Z" fill="${FILL}" stroke="${STROKE}" stroke-width="1.4"/>`;
  } else if(mode==='tube'){
    const t=(ex.t||0)*scale;
    const ix=x0+t, iy=y0+t, iw=Math.max(dw-2*t,1), ih=Math.max(dh-2*t,1);
    shapeSvg=`<path fill-rule="evenodd" d="M${x0.toFixed(1)},${y0.toFixed(1)} h${dw.toFixed(1)} v${dh.toFixed(1)} h${(-dw).toFixed(1)} Z M${ix.toFixed(1)},${iy.toFixed(1)} h${iw.toFixed(1)} v${ih.toFixed(1)} h${(-iw).toFixed(1)} Z" fill="${FILL}" stroke="${STROKE}" stroke-width="1.4"/>`;
  }
  const cyC=(y0+g.cTop*scale);
  const centroidSvg=`<line x1="${(x0-4).toFixed(1)}" y1="${cyC.toFixed(1)}" x2="${(x0+dw+4).toFixed(1)}" y2="${cyC.toFixed(1)}" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/><circle cx="${(x0+dw/2).toFixed(1)}" cy="${cyC.toFixed(1)}" r="2.4" fill="#dc2626"/>`;
  const labelX=x0+dw+10;
  const labelSvg=`<line x1="${labelX.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${labelX.toFixed(1)}" y2="${cyC.toFixed(1)}" stroke="#94a3b8" stroke-width="1"/>
    <line x1="${labelX.toFixed(1)}" y1="${cyC.toFixed(1)}" x2="${labelX.toFixed(1)}" y2="${(y0+dh).toFixed(1)}" stroke="#94a3b8" stroke-width="1"/>
    <text x="${(labelX+4).toFixed(1)}" y="${((y0+cyC)/2+3).toFixed(1)}" font-size="9.5" fill="#334155">e_g=${fmtSmart(g.cTop)}</text>
    <text x="${(labelX+4).toFixed(1)}" y="${((cyC+y0+dh)/2+3).toFixed(1)}" font-size="9.5" fill="#334155">e_d=${fmtSmart(g.cBot)}</text>`;
  return `<svg viewBox="0 0 ${VB_W} ${VB_H}" style="width:100%;max-width:220px;height:auto;display:block;margin:6px auto;">${shapeSvg}${centroidSvg}${labelSvg}</svg>`;
}

/* =========================================================================
   MOBILE BOTTOM PANEL — dynamiczna wysokość sterowana przeciąganiem
   ========================================================================= */
function initMobilePanelResize(){
  const sidebarEl = document.getElementById('sidebar');
  const handleEl  = document.getElementById('panelHandle');
  const scrollEl  = document.getElementById('sidebarScroll');
  const statusbarEl = document.getElementById('statusbar'); // dodatkowy, większy cel do złapania — patrz niżej
  if(!sidebarEl || !handleEl || !scrollEl) return;
  const mq = window.matchMedia('(max-width:860px)');
  const PANEL_MIN = 20;        // px — minimalna wysokość panelu
  const PANEL_MAX_RATIO = 0.62; // panel nie większy niż 62% wysokości okna

  let panelH = null; // aktualna wysokość panelu w px (null = jeszcze nieustawiona)

  function viewportH(){
    return (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  }
  function maxH(){ return Math.round(viewportH() * PANEL_MAX_RATIO); }

  function applyHeight(h){
    const clamped = Math.max(PANEL_MIN, Math.min(maxH(), h));
    panelH = clamped;
    sidebarEl.style.height = panelH + 'px';
    return clamped;
  }

  // --- przeciąganie uchwytu (zmienia wysokość za pomocą dotyku lub myszy) ---
  let dragging = false, anchorY = 0, anchorH = 0;

  function getClientY(e){
    if(e.touches && e.touches.length > 0) return e.touches[0].clientY;
    return e.clientY;
  }

  function onDragStart(e){
    if(!mq.matches) return;
    if(e.type === 'mousedown' && e.button !== 0) return;
    if(e.touches && e.touches.length !== 1) return;
    dragging = true;
    anchorY = getClientY(e);
    anchorH = panelH ?? sidebarEl.getBoundingClientRect().height;
    if(e.type === 'mousedown'){
      e.preventDefault();
      document.body.style.cursor = 'row-resize';
      document.body.style.userSelect = 'none';
      window.addEventListener('mousemove', onDragMove);
      window.addEventListener('mouseup', onDragEnd);
    }
  }

  function onDragMove(e){
    if(!dragging) return;
    if(e.touches && e.touches.length !== 1) return;
    if(e.cancelable) e.preventDefault();
    applyHeight(anchorH - (getClientY(e) - anchorY));
  }

  function onDragEnd(e){
    if(!dragging) return;
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    window.removeEventListener('mousemove', onDragMove);
    window.removeEventListener('mouseup', onDragEnd);
  }

  handleEl.addEventListener('touchstart', onDragStart, {passive:true});
  handleEl.addEventListener('touchmove', onDragMove, {passive:false});
  handleEl.addEventListener('touchend', onDragEnd, {passive:true});
  handleEl.addEventListener('touchcancel', onDragEnd, {passive:true});
  handleEl.addEventListener('mousedown', onDragStart);

  if(statusbarEl){
    statusbarEl.addEventListener('touchstart', onDragStart, {passive:true});
    statusbarEl.addEventListener('touchmove', onDragMove, {passive:false});
    statusbarEl.addEventListener('touchend', onDragEnd, {passive:true});
    statusbarEl.addEventListener('touchcancel', onDragEnd, {passive:true});
    statusbarEl.addEventListener('mousedown', onDragStart);
  }

  function resetForViewport(){
    if(mq.matches){
      if(panelH == null) panelH = Math.round(viewportH() * 0.44);
      applyHeight(panelH);
    } else {
      // Desktop: wracamy do layoutu flex sterowanego przez CSS.
      sidebarEl.style.height = '';
      panelH = null;
      dragging = false;
    }
  }

  if(mq.addEventListener) mq.addEventListener('change', resetForViewport);
  else mq.addListener(resetForViewport); // starsze przeglądarki
  window.addEventListener('resize', ()=>{ if(mq.matches && panelH!=null) applyHeight(panelH); });

  /* ---- Klawiatura ekranowa ---- */
  function reclamp(){
    if(!mq.matches || panelH==null) return;
    applyHeight(panelH);
  }
  function reclampSoon(){
    reclamp();
    setTimeout(reclamp, 350);
  }
  if(window.visualViewport) window.visualViewport.addEventListener('resize', reclampSoon);
  scrollEl.addEventListener('focusout', reclampSoon);

  resetForViewport();
}

/* =========================================================================
   INIT
   ========================================================================= */
function init(){
  canvas=document.getElementById('cv');
  ctx=canvas.getContext('2d');
  buildToolbar();
  initEvents();
  fitView();
  resizeCanvas();
  setMode('select');
  renderSidebar();
  render();

  const resettle = ()=>{
    if(userAdjustedView) return;
    resizeCanvas();
    fitView();
    render();
  };
  requestAnimationFrame(()=>requestAnimationFrame(resettle));
  setTimeout(resettle, 300);
  setTimeout(resettle, 900);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', ()=>{ resizeCanvas(); });
  }

  if('ResizeObserver' in window){
    let roPending=false;
    const ro = new ResizeObserver(()=>{
      if(roPending) return;
      roPending=true;
      requestAnimationFrame(()=>{ roPending=false; resizeCanvas(); });
    });
    ro.observe(document.getElementById('canvasWrap'));
  }

  initMobilePanelResize();
}
window.addEventListener('DOMContentLoaded', init);
</script>
