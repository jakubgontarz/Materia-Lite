/* =========================================================================
   MODEL BUILDING + SOLVE
   ========================================================================= */
function buildSolverModel(){
  const nodesArr = nodes.map(n=>({id:n.id, x:n.x, y:n.y, mass:n.mass}));
  const elementsArr = elements.map(el=>{
    const mat=getMaterial(el.materialId), sec=getSection(el.sectionId);
    const E=mat.E*UNIT.GPa, A_real=sec.A*UNIT.cm2, I=sec.I*UNIT.cm4, alpha=mat.alpha*UNIT.alphaU;
    // cTop/cBot = distance (centroid -> extreme fibre) for asymmetric sections
    // (e.g. catalog tees). Falls back to a symmetric h/2 split for sections
    // that only ever defined h (older library entries / imported JSON).
    const cTopCm = (sec.cTop!=null) ? sec.cTop : (sec.h||0)/2;
    const cBotCm = (sec.cBot!=null) ? sec.cBot : (sec.h||0)/2;
    const cTop=cTopCm*UNIT.cm, cBot=cBotCm*UNIT.cm;
    const h=(cTopCm+cBotCm)*UNIT.cm; // kept for anything still reading el.h
    const A = includeAxialDeformation ? A_real : A_real*AXIAL_RIGID_FACTOR;
    const density = (mat.density != null) ? mat.density : 7850;
    const obj={id:el.id,n1:el.n1,n2:el.n2,E,A,A_real,I,alpha,h,cTop,cBot,density,hingeStart:!!el.hingeStart,hingeEnd:!!el.hingeEnd};
    if(el.q){
      let qS=el.q.qStart, qE=el.q.qEnd, ang=el.q.angle;
      if(el.q.mode==='vertical' || el.q.mode==='horizontal'){
        const na=getNode(el.n1), nb=getNode(el.n2);
        const dx=nb.x-na.x, dy=nb.y-na.y, Lb=Math.hypot(dx,dy)||1;
        const factor = el.q.mode==='vertical' ? Math.abs(dx/Lb) : Math.abs(dy/Lb);
        qS=qS*factor; qE=qE*factor;
      }
      obj.qStart=qS; obj.qEnd=qE; obj.qAngle=ang;
    }
    if(el.thermal){ obj.dTtop=el.thermal.dTtop; obj.dTbottom=el.thermal.dTbottom; }
    if(includeSelfWeight){ obj.selfWeightQ = mat.density*9.81/1000*A_real; } // kg/m3 * m/s2 / 1000 * m2 = kN/m
    if(el.hingeStart && el.momentHingeStart){ obj.momentHingeStart=el.momentHingeStart; }
    if(el.hingeEnd && el.momentHingeEnd){ obj.momentHingeEnd=el.momentHingeEnd; }
    return obj;
  });
  const supportsArr = nodes.filter(n=>n.support).map(n=>{
    const sp=n.support;
    function conv(dir,isRot){
      if(!dir||dir.type==='free') return {type:'free'};
      if(dir.type==='fixed') return {type:'fixed', delta:(dir.delta||0)*(isRot?UNIT.deg:UNIT.cm)};
      return {type:'spring', k:dir.k||0, delta:(dir.delta||0)*(isRot?UNIT.deg:UNIT.cm)};
    }
    return {nodeId:n.id, angleDeg:sp.angleDeg||0, ux:conv(sp.ux,false), uy:conv(sp.uy,false), rz:conv(sp.rz,true)};
  });
  const nodalLoads=[];
  nodes.forEach(n=>{
    if(n.force){ const {Fx,Fy}=forceComponents(n.force); nodalLoads.push({nodeId:n.id, Fx, Fy, M:0}); }
    if(n.moment){ nodalLoads.push({nodeId:n.id, Fx:0, Fy:0, M:n.moment.M}); }
  });
  return {nodes:nodesArr, elements:elementsArr, supports:supportsArr, nodalLoads};
}

function modelBBox(){
  if(nodes.length===0) return {minX:0,minY:0,maxX:10,maxY:10};
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  nodes.forEach(n=>{ minX=Math.min(minX,n.x); maxX=Math.max(maxX,n.x); minY=Math.min(minY,n.y); maxY=Math.max(maxY,n.y); });
  if(minX===maxX){minX-=2;maxX+=2;} if(minY===maxY){minY-=2;maxY+=2;}
  return {minX,minY,maxX,maxY};
}

function runAnalysis(){
  const anType = (analysisSettings && analysisSettings.type) || 'linear_static';
  if(anType === 'stability'){
    runStabilityAnalysis();
    return;
  }
  if(anType === 'modal'){
    runModalAnalysis();
    return;
  }
  if(anType === 'harmonic'){
    runHarmonicAnalysis();
    return;
  }
  if(anType === 'influence'){
    runInfluenceAnalysis();
    return;
  }
  if(anType === 'envelope'){
    runEnvelopeAnalysis();
    return;
  }
  runLinearStaticAnalysis();
}

function runLinearStaticAnalysis(){
  if(nodes.length<2 || elements.length<1){
    solveWarning='Dodaj co najmniej dwa węzły i jeden pręt, aby uruchomić obliczenia.';
    solved=null; diagrams=null; renderSidebar(); render(); updateRunButton(); return;
  }
  const hasAnySupport = nodes.some(n=>n.support && (
    (n.support.ux&&n.support.ux.type!=='free') || (n.support.uy&&n.support.uy.type!=='free') || (n.support.rz&&n.support.rz.type!=='free')));
  if(!hasAnySupport){
    solveWarning='Model nie ma zdefiniowanych podpór — układ jest niestabilny.';
    solved=null; diagrams=null; renderSidebar(); render(); updateRunButton(); return;
  }
  const model = buildSolverModel();
  let out;
  try{ out = FEM.solveModel(model); }
  catch(e){ solveWarning='Błąd obliczeń: '+e.message; solved=null; diagrams=null; renderSidebar(); render(); updateRunButton(); return; }
  solved = out;

function buildHarmonicModels(){
  const includeElementMass = !(analysisSettings && analysisSettings.params && analysisSettings.params.includeElementMass === false);
  const includeGravity = !!(analysisSettings && analysisSettings.params && analysisSettings.params.includeGravity);

  // 1. Applied static & dynamic loads model (without gravity)
  const staticModel = buildSolverModel();

  // 2. Gravity model (vertical downward nodal masses and self-weight)
  let gravityModel = null;
  if(includeGravity){
    const nodesArr = nodes.map(n => ({ id: n.id, x: n.x, y: n.y, mass: n.mass }));
    const elementsArr = elements.map(el => {
      const mat = getMaterial(el.materialId), sec = getSection(el.sectionId);
      const E = mat.E * UNIT.GPa, A_real = sec.A * UNIT.cm2, I = sec.I * UNIT.cm4, alpha = mat.alpha * UNIT.alphaU;
      const cTopCm = (sec.cTop != null) ? sec.cTop : (sec.h || 0) / 2;
      const cBotCm = (sec.cBot != null) ? sec.cBot : (sec.h || 0) / 2;
      const cTop = cTopCm * UNIT.cm, cBot = cBotCm * UNIT.cm, h = (cTopCm + cBotCm) * UNIT.cm;
      const A = includeAxialDeformation ? A_real : A_real * AXIAL_RIGID_FACTOR;
      const density = (mat.density != null) ? mat.density : 7850;
      const obj = { id: el.id, n1: el.n1, n2: el.n2, E, A, A_real, I, alpha, h, cTop, cBot, density, hingeStart: !!el.hingeStart, hingeEnd: !!el.hingeEnd };
      if(includeElementMass){
        obj.selfWeightQ = mat.density * 9.81 / 1000 * A_real; // kN/m downwards
      }
      return obj;
    });
    const supportsArr = nodes.filter(n => n.support).map(n => {
      const sp = n.support;
      function conv(dir, isRot){
        if(!dir || dir.type === 'free') return { type: 'free' };
        if(dir.type === 'fixed') return { type: 'fixed', delta: 0 };
        return { type: 'spring', k: dir.k || 0, delta: 0 };
      }
      return { nodeId: n.id, angleDeg: sp.angleDeg || 0, ux: conv(sp.ux, false), uy: conv(sp.uy, false), rz: conv(sp.rz, true) };
    });
    const nodalLoads = [];
    nodes.forEach(n => {
      if(n.mass && n.mass.my){
        const mKg = n.mass.my || 0;
        if(mKg > 0){
          nodalLoads.push({ nodeId: n.id, Fx: 0, Fy: -(mKg * 9.81 / 1000), M: 0 }); // kN downwards
        }
      }
    });
    gravityModel = { nodes: nodesArr, elements: elementsArr, supports: supportsArr, nodalLoads };
  }

  return { staticModel, gravityModel, includeElementMass, includeGravity };
}

function prepareHarmonicCombination(combKey){
  if(!solved || solved.type !== 'harmonic') return;
  const cfg = HARMONIC_COMBS[combKey] || HARMONIC_COMBS['stat_plus_dyn'];
  solved.combKey = cfg.id;
  if(lastResultViewsPerType.harmonic){
    lastResultViewsPerType.harmonic.combKey = cfg.id;
  }

  const sStat = cfg.sStat;
  const sInertia = cfg.sInertia;
  const sGrav = cfg.sGrav;
  const staticSol = solved.staticSol;
  const dynSol = solved.dynSol;
  const gravSol = solved.gravSol;

  const nDof = 3 * nodes.length;
  solved.D = zerosVec(nDof);
  solved.Rglobal = zerosVec(nDof);

  for(let i = 0; i < nDof; i++){
    const statD = staticSol ? staticSol.D[i] : 0;
    const harmD = dynSol ? dynSol.D[i] : 0;
    const inertD = harmD - statD;
    const gravD = (sGrav && gravSol) ? gravSol.D[i] : 0;

    solved.D[i] = sStat * statD + sInertia * inertD + gravD;

    const statR = staticSol ? staticSol.Rglobal[i] : 0;
    const harmR = dynSol ? dynSol.Rglobal[i] : 0;
    const inertR = harmR - statR;
    const gravR = (sGrav && gravSol) ? gravSol.Rglobal[i] : 0;

    solved.Rglobal[i] = sStat * statR + sInertia * inertR + gravR;
  }

  diagrams = {};
  let maxDisp = 0, maxM = 0, maxT = 0, maxN = 0, maxS = 0;
  const NSAMP = 40;

  elements.forEach((el, idx) => {
    const elId = el.id;
    const edDyn = dynSol.elemData[idx];
    const L = edDyn.L;
    const pts = [];
    for(let i = 0; i <= NSAMP; i++){
      const x = L * i / NSAMP;
      const prStat = staticSol ? FEM.pointResults(staticSol.results[idx], x) : { N:0, V:0, M:0, u_local:0, v_local:0, theta:0, Ux_global:0, Uy_global:0, sigTop:0, sigBot:0 };
      const prHarm = FEM.pointResults(dynSol.results[idx], x);
      const prGrav = (sGrav && gravSol) ? FEM.pointResults(gravSol.results[idx], x) : null;

      function combVal(key){
        const vStat = prStat[key] || 0;
        const vHarm = prHarm[key] || 0;
        const vInert = vHarm - vStat;
        const vGrav = prGrav ? (prGrav[key] || 0) : 0;
        return sStat * vStat + sInertia * vInert + vGrav;
      }

      const pr = {
        x,
        N: combVal('N'),
        V: combVal('V'),
        M: combVal('M'),
        u_local: combVal('u_local'),
        v_local: combVal('v_local'),
        theta: combVal('theta'),
        Ux_global: combVal('Ux_global'),
        Uy_global: combVal('Uy_global'),
        sigTop: combVal('sigTop'),
        sigBot: combVal('sigBot')
      };
      pts.push(pr);

      maxDisp = Math.max(maxDisp, Math.hypot(pr.Ux_global, pr.Uy_global));
      maxM = Math.max(maxM, Math.abs(pr.M));
      maxT = Math.max(maxT, Math.abs(pr.V));
      maxN = Math.max(maxN, Math.abs(pr.N));
      maxS = Math.max(maxS, Math.abs(pr.sigTop), Math.abs(pr.sigBot));
    }
    diagrams[elId] = { pts, L, c: edDyn.c, s: edDyn.s, n1: getNode(el.n1) };
  });

  const bbox = modelBBox();
  const diag = Math.hypot(bbox.maxX - bbox.minX, bbox.maxY - bbox.minY) || 10;
  autoDeform = maxDisp > 1e-9 ? (0.15 * diag) / maxDisp : 1;
  autoDiagM = maxM > 1e-9 ? (0.14 * diag) / maxM : 1;
  autoDiagT = maxT > 1e-9 ? (0.14 * diag) / maxT : 1;
  autoDiagN = maxN > 1e-9 ? (0.14 * diag) / maxN : 1;
  autoDiagS = maxS > 1e-9 ? (0.14 * diag) / maxS : 1;
  magM = maxM; magT = maxT; magN = maxN; magS = maxS;

  let maxR = 0;
  for(let i = 0; i < solved.Rglobal.length; i++) maxR = Math.max(maxR, Math.abs(solved.Rglobal[i]));
  magReaction = maxR;
}

function setHarmonicCombination(combKey){
  if(!solved || solved.type !== 'harmonic') return;
  prepareHarmonicCombination(combKey);
  renderSidebar();
  render();
}

function runHarmonicAnalysis(){
  if(nodes.length < 2 || elements.length < 1){
    solveWarning = 'Dodaj co najmniej dwa węzły i jeden pręt, aby uruchomić obliczenia.';
    solved = null; diagrams = null; renderSidebar(); render(); updateRunButton(); return;
  }
  const hasAnySupport = nodes.some(n => n.support && (
    (n.support.ux && n.support.ux.type !== 'free') || (n.support.uy && n.support.uy.type !== 'free') || (n.support.rz && n.support.rz.type !== 'free')));
  if(!hasAnySupport){
    solveWarning = 'Model nie ma zdefiniowanych podpór — układ jest niestabilny.';
    solved = null; diagrams = null; renderSidebar(); render(); updateRunButton(); return;
  }

  const { staticModel, gravityModel, includeElementMass, includeGravity } = buildHarmonicModels();
  const freqHz = (analysisSettings && analysisSettings.params && analysisSettings.params.harmonicFreq != null) ?
                 Math.max(0, parseFloat(analysisSettings.params.harmonicFreq) || 0) : 5.0;

  let staticSol = null, dynSol = null, gravSol = null;
  try{
    staticSol = FEM.solveLinearStatic(staticModel);
    dynSol = FEM.solveHarmonic(staticModel, freqHz, { includeElementMass });
    if(gravityModel){
      gravSol = FEM.solveLinearStatic(gravityModel);
    }
  } catch(e){
    solveWarning = 'Błąd analizy harmonicznej: ' + e.message;
    solved = null; diagrams = null; renderSidebar(); render(); updateRunButton(); return;
  }

  if(staticSol && staticSol.singular){
    solveWarning = 'Układ jest geometrycznie zmienny lub niedostatecznie podparty — macierz sztywności jest osobliwa.';
    solved = null; diagrams = null; renderSidebar(); render(); updateRunButton(); return;
  }

  const defaultComb = (lastResultViewsPerType.harmonic && lastResultViewsPerType.harmonic.combKey) || 'stat_plus_dyn';

  solved = {
    type: 'harmonic',
    freqHz: dynSol.freqHz,
    omega: dynSol.omega,
    includeGravity,
    includeElementMass,
    combKey: defaultComb,
    staticSol,
    dynSol,
    gravSol,
    elemData: dynSol.elemData,
    nodeIndex: dynSol.nodeIndex,
    singular: dynSol.singular,
    D: zerosVec(3 * nodes.length),
    Rglobal: zerosVec(3 * nodes.length),
    results: dynSol.results
  };

  solveWarning = dynSol.singular ? 'Wykryto osobliwość lub rezonans dokładny (brak tłumienia) — częstość wymuszenia pokrywa się z częstością własną układu.' : null;

  prepareHarmonicCombination(defaultComb);

  deformMult = 1; diagMult = 1;
  restoreResultViewForType('harmonic');
  if(elements.length && probe.elId == null) probe.elId = elements[0].id;

  renderSidebar();
  render();
  updateRunButton();
  setStatusHint(`Obliczono drgania wymuszone (f = ${fmtSmart(freqHz, 3)} Hz, ω = ${fmtSmart(dynSol.omega, 2)} rad/s${includeGravity ? ', z grawitacją' : ''}).`);
}

function runInfluenceAnalysis(){
  if(nodes.length<2 || elements.length<1){
    solveWarning='Dodaj co najmniej dwa węzły i jeden pręt, aby uruchomić obliczenia.';
    solved=null; diagrams=null; ilDiagrams=null; renderSidebar(); render(); updateRunButton(); return;
  }
  const hasAnySupport = nodes.some(n=>n.support && (
    (n.support.ux&&n.support.ux.type!=='free') || (n.support.uy&&n.support.uy.type!=='free') || (n.support.rz&&n.support.rz.type!=='free')));
  if(!hasAnySupport){
    solveWarning='Model nie ma zdefiniowanych podpór — układ jest niestabilny.';
    solved=null; diagrams=null; ilDiagrams=null; renderSidebar(); render(); updateRunButton(); return;
  }
  const params = (analysisSettings && analysisSettings.params) || {};
  const ilElId = ilResolveElement(params);
  const ilEnd = ilResolveEnd(params);
  if(ilElId==null){
    solveWarning='Wybierz pręt, dla którego ma zostać wyznaczona linia wpływu.';
    solved=null; diagrams=null; ilDiagrams=null; renderSidebar(); render(); updateRunButton(); return;
  }

  const model = buildSolverModel();
  const byType={}, extremes={};
  let anySingular=false;
  try{
    ['N','T','M'].forEach(type=>{
      const out = FEM.solveInfluenceLine(model, ilElId, ilEnd, type);
      byType[type]=out;
      anySingular = anySingular || out.singular;
    });
  } catch(e){
    solveWarning='Błąd obliczeń linii wpływu: '+e.message;
    solved=null; diagrams=null; ilDiagrams=null; renderSidebar(); render(); updateRunButton(); return;
  }

  ilDiagrams = {N:{}, T:{}, M:{}};
  const NSAMP=40;
  const bbox = modelBBox();
  const diag = Math.hypot(bbox.maxX-bbox.minX, bbox.maxY-bbox.minY) || 10;
  ['N','T','M'].forEach(type=>{
    const out=byType[type];
    let maxAbs=0, maxV=-Infinity, maxAt=null, minV=Infinity, minAt=null;
    out.results.forEach((edRes,idx)=>{
      const elId=elements[idx].id;
      const pts=[];
      for(let i=0;i<=NSAMP;i++){
        const x=edRes.L*i/NSAMP;
        const pr=FEM.pointResults(edRes,x);
        pts.push(pr);
        const v=pr.v_local;
        maxAbs=Math.max(maxAbs,Math.abs(v));
        if(v>maxV){ maxV=v; maxAt={elId,x}; }
        if(v<minV){ minV=v; minAt={elId,x}; }
      }
      ilDiagrams[type][elId]={pts, L:edRes.L, c:edRes.c, s:edRes.s, n1:getNode(elements[idx].n1)};
    });
    extremes[type]={max:maxV,maxAt,min:minV,minAt,magnitude:maxAbs};
  });

  autoDiagN = extremes.N.magnitude>1e-9 ? (0.14*diag)/extremes.N.magnitude : 1;
  autoDiagT = extremes.T.magnitude>1e-9 ? (0.14*diag)/extremes.T.magnitude : 1;
  autoDiagM = extremes.M.magnitude>1e-9 ? (0.14*diag)/extremes.M.magnitude : 1;
  magN=extremes.N.magnitude; magT=extremes.T.magnitude; magM=extremes.M.magnitude;

  solved = {type:'influence', ilElementId:ilElId, ilEnd, byType, extremes, singular:anySingular,
            elemData:byType.M.elemData, nodeIndex:byType.M.nodeIndex};
  solveWarning = anySingular ? 'Układ może być geometrycznie niestabilny lub niedostatecznie podparty — wyniki mogą być błędne.' : null;
  diagrams=null;
  deformMult=1; diagMult=1;
  restoreResultViewForType('influence');
  probe.elId = ilElId;
  probe.t = ilEnd==='end' ? 1 : 0;

  renderSidebar();
  render();
  updateRunButton();
  const elLbl = `P${ilElId}`;
  setStatusHint(`Obliczono linię wpływu dla przekroju ${elLbl} (${ilEnd==='start'?'węzeł początkowy':'węzeł końcowy'}).`);
}

function runEnvelopeAnalysis(){
  if(nodes.length<2 || elements.length<1){
    solveWarning='Dodaj co najmniej dwa węzły i jeden pręt, aby uruchomić obliczenia.';
    solved=null; diagrams=null; renderSidebar(); render(); updateRunButton(); return;
  }
  const hasAnySupport = nodes.some(n=>n.support && (
    (n.support.ux&&n.support.ux.type!=='free') || (n.support.uy&&n.support.uy.type!=='free') || (n.support.rz&&n.support.rz.type!=='free')));
  if(!hasAnySupport){
    solveWarning='Model nie ma zdefiniowanych podpór — układ jest niestabilny.';
    solved=null; diagrams=null; renderSidebar(); render(); updateRunButton(); return;
  }
  const params = (analysisSettings && analysisSettings.params) || {};
  const loadP = (params.envelopeP != null) ? params.envelopeP : 1.0;
  const route = params.envelopeRoute || 'all';
  const trajectoryElemIds = (route === 'selected' && selection.elemIds.length > 0)
    ? selection.elemIds
    : null;

  const model = buildSolverModel();
  let out;
  try {
    out = FEM.solveEnvelope(model, { loadP, trajectoryElemIds });
  } catch(e){
    solveWarning = 'Błąd obliczeń obwiedni: ' + e.message;
    solved=null; diagrams=null; renderSidebar(); render(); updateRunButton(); return;
  }

  solved = out;
  solveWarning = out.singular ? 'Układ może być geometrycznie niestabilny lub niedostatecznie podparty — wyniki mogą być błędne.' : null;

  const bbox = modelBBox();
  const diag = Math.hypot(bbox.maxX - bbox.minX, bbox.maxY - bbox.minY) || 10;
  autoDiagM = out.extremes.M.magnitude > 1e-9 ? (0.14 * diag) / out.extremes.M.magnitude : 1;
  autoDiagT = out.extremes.T.magnitude > 1e-9 ? (0.14 * diag) / out.extremes.T.magnitude : 1;
  autoDiagN = out.extremes.N.magnitude > 1e-9 ? (0.14 * diag) / out.extremes.N.magnitude : 1;
  autoDiagS = out.extremes.S.magnitude > 1e-9 ? (0.14 * diag) / out.extremes.S.magnitude : 1;

  magM = out.extremes.M.magnitude;
  magT = out.extremes.T.magnitude;
  magN = out.extremes.N.magnitude;
  magS = out.extremes.S.magnitude;

  let maxR = 0;
  Object.values(out.reactionsEnvelope).forEach(r => {
    maxR = Math.max(maxR, Math.abs(r.Rx_max), Math.abs(r.Rx_min), Math.abs(r.Ry_max), Math.abs(r.Ry_min), Math.abs(r.Rm_max), Math.abs(r.Rm_min));
  });
  magReaction = maxR;

  diagrams = null;
  ilDiagrams = null;
  deformMult = 1; diagMult = 1;
  restoreResultViewForType('envelope');
  if(elements.length && probe.elId == null) probe.elId = elements[0].id;

  renderSidebar();
  render();
  updateRunButton();
  setStatusHint(`Obliczono obwiednię sił wewnętrznych dla ruchomej siły pionowej P = ${fmtSmart(loadP)} kN.`);
}

/* =========================================================================
   GEOMETRY / VIEW TRANSFORM
   ========================================================================= */
function toScreen(x,y){ return {x: view.offX + x*view.scale, y: view.offY - y*view.scale}; }
function toModel(px,py){ return {x: (px-view.offX)/view.scale, y: -(py-view.offY)/view.scale}; }

function fitView(){
  const rect = canvas.getBoundingClientRect();
  const bbox = modelBBox();
  const w = Math.max(bbox.maxX-bbox.minX, 0.001), h = Math.max(bbox.maxY-bbox.minY, 0.001);
  const margin=70;
  const sx = (rect.width-2*margin)/w, sy=(rect.height-2*margin)/h;
  view.scale = Math.max(4, Math.min(sx,sy, 300));
  const cx=(bbox.minX+bbox.maxX)/2, cy=(bbox.minY+bbox.maxY)/2;
  view.offX = rect.width/2 - cx*view.scale;
  view.offY = rect.height/2 + cy*view.scale;
}

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  if(rect.width<2 || rect.height<2) return; // layout not settled yet — a later pass will retry
  DPR = window.devicePixelRatio||1;
  canvas.width = Math.round(rect.width*DPR);
  canvas.height = Math.round(rect.height*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  render();
}

/* =========================================================================
   NODE / ELEMENT CRUD
   ========================================================================= */
function snap(v){ return snapEnabled ? Math.round(v/snapSize)*snapSize : Math.round(v*1000)/1000; }

function createNode(x,y,skipSnap){
  const id = nextNodeId++;
  const px = skipSnap ? Math.round(x*1e6)/1e6 : snap(x);
  const py = skipSnap ? Math.round(y*1e6)/1e6 : snap(y);
  nodes.push({id, x:px, y:py, force:null, moment:null, support:null, mass:null});
  return id;
}
function createElement(n1,n2){
  if(n1===n2) return null;
  const a=getNode(n1), b=getNode(n2);
  if(Math.hypot(b.x-a.x,b.y-a.y) < 1e-4) return null;
  const exists = elements.some(e=>(e.n1===n1&&e.n2===n2)||(e.n1===n2&&e.n2===n1));
  if(exists) return null;
  const id = nextElemId++;
  elements.push({id,n1,n2,sectionId:defaultSectionId,materialId:defaultMaterialId,
    hingeStart:false,hingeEnd:false,q:null,thermal:null});
  invalidateResults();
  return id;
}
function deleteNode(id){
  elements = elements.filter(e=>e.n1!==id && e.n2!==id);
  nodes = nodes.filter(n=>n.id!==id);
  invalidateResults();
}
function deleteElement(id){
  elements = elements.filter(e=>e.id!==id);
  invalidateResults();
}

function mergeNodeInto(sourceId, targetId){
  if(sourceId === targetId) return;
  const src = getNode(sourceId);
  const tgt = getNode(targetId);
  if(!src || !tgt) return;

  // 1. Przeniesienie / połączenie podpór i obciążeń z usuwanego węzła do docelowego
  if(src.support && !tgt.support){
    tgt.support = JSON.parse(JSON.stringify(src.support));
  }
  if(src.force){
    if(!tgt.force){
      tgt.force = JSON.parse(JSON.stringify(src.force));
    } else {
      const c1 = forceComponents(tgt.force);
      const c2 = forceComponents(src.force);
      const fx = c1.Fx + c2.Fx;
      const fy = c1.Fy + c2.Fy;
      const F = Math.hypot(fx, fy);
      if(F > 1e-4){
        let ang = Math.atan2(fy, fx) * 180 / Math.PI;
        if(ang < 0) ang += 360;
        tgt.force = { mode:'polar', F: Math.round(F * 1000) / 1000, angle: Math.round(ang * 100) / 100 };
      } else {
        tgt.force = null;
      }
    }
  }
  if(src.moment){
    if(!tgt.moment){
      tgt.moment = JSON.parse(JSON.stringify(src.moment));
    } else {
      const newM = (tgt.moment.M || 0) + (src.moment.M || 0);
      if(Math.abs(newM) > 1e-4){
        tgt.moment = { M: Math.round(newM * 1000) / 1000 };
      } else {
        tgt.moment = null;
      }
    }
  }
  if(src.mass){
    if(!tgt.mass){
      tgt.mass = JSON.parse(JSON.stringify(src.mass));
    } else {
      const newMx = (tgt.mass.mx || 0) + (src.mass.mx || 0);
      const newMy = (tgt.mass.my || 0) + (src.mass.my || 0);
      const newIm = (tgt.mass.Im || 0) + (src.mass.Im || 0);
      if(Math.abs(newMx) > 1e-6 || Math.abs(newMy) > 1e-6 || Math.abs(newIm) > 1e-6){
        tgt.mass = {
          mx: Math.round(newMx * 1000) / 1000,
          my: Math.round(newMy * 1000) / 1000,
          Im: Math.round(newIm * 1000) / 1000
        };
      } else {
        tgt.mass = null;
      }
    }
  }

  // 2. Aktualizacja wszystkich prętów dochodzących do usuwanego węzła
  elements.forEach(e => {
    if(e.n1 === sourceId) e.n1 = targetId;
    if(e.n2 === sourceId) e.n2 = targetId;
  });

  // 3. Usunięcie prętów o zerowej długości (które łączyły src i tgt)
  elements = elements.filter(e => e.n1 !== e.n2);

  // 4. Usunięcie nałożonych na siebie prętów (zostawiamy tylko jeden dla danej pary węzłów)
  const uniqueElements = [];
  const seenPairs = new Set();
  elements.forEach(e => {
    const minN = Math.min(e.n1, e.n2);
    const maxN = Math.max(e.n1, e.n2);
    const pairKey = minN + '_' + maxN;
    if(!seenPairs.has(pairKey)){
      seenPairs.add(pairKey);
      uniqueElements.push(e);
    }
  });
  elements = uniqueElements;

  // 5. Usunięcie źródłowego węzła
  nodes = nodes.filter(n => n.id !== sourceId);

  // 6. Aktualizacja zaznaczenia
  if(selection.nodeIds.includes(sourceId)){
    selection.nodeIds = selection.nodeIds.filter(id => id !== sourceId);
    if(!selection.nodeIds.includes(targetId)) selection.nodeIds.push(targetId);
  }
  const validElemIds = new Set(elements.map(e => e.id));
  selection.elemIds = selection.elemIds.filter(id => validElemIds.has(id));

  invalidateResults();
  setStatusHint(`Połączono węzeł W${sourceId} z istniejącym węzłem W${targetId}.`);
}

function checkAndMergeCoincidentNode(nodeId){
  const node = getNode(nodeId);
  if(!node) return null;
  const target = nodes.find(n => n.id !== nodeId && Math.hypot(n.x - node.x, n.y - node.y) < 1e-4);
  if(target){
    mergeNodeInto(nodeId, target.id);
    return target.id;
  }
  return null;
}

/* =========================================================================
   RENDERING
   ========================================================================= */
function niceGridStep(minModelSpacing){
  const steps=[0.1,0.2,0.25,0.5,1,2,2.5,5,10,20,25,50,100,200,500];
  for(const s of steps) if(s>=minModelSpacing) return s;
  return 1000;
}
function elemBasePoint(n1,c,s,x){ return {x:n1.x+x*c, y:n1.y+x*s}; }

function drawGrid(){
  const rect=canvas.getBoundingClientRect();
  const step = niceGridStep(55/view.scale);
  const major = step*5;
  const topLeft = toModel(0,0), botRight = toModel(rect.width,rect.height);
  const x0=Math.floor(topLeft.x/step)*step, x1=Math.ceil(botRight.x/step)*step;
  const y0=Math.floor(botRight.y/step)*step, y1=Math.ceil(topLeft.y/step)*step;
  ctx.lineWidth=1;
  for(let x=x0;x<=x1;x+=step){
    const isMajor = Math.abs(Math.round(x/major)*major - x) < step/2;
    ctx.strokeStyle = isMajor ? getCss('--grid-line-major') : getCss('--grid-line');
    const p0=toScreen(x,topLeft.y), p1=toScreen(x,botRight.y);
    ctx.beginPath(); ctx.moveTo(p0.x+.5,p0.y); ctx.lineTo(p1.x+.5,p1.y); ctx.stroke();
  }
  for(let y=y0;y<=y1;y+=step){
    const isMajor = Math.abs(Math.round(y/major)*major - y) < step/2;
    ctx.strokeStyle = isMajor ? getCss('--grid-line-major') : getCss('--grid-line');
    const p0=toScreen(topLeft.x,y), p1=toScreen(botRight.x,y);
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y+.5); ctx.lineTo(p1.x,p1.y+.5); ctx.stroke();
  }
  // origin axes
  ctx.strokeStyle=getCss('--axis-color'); ctx.lineWidth=1.4;
  const o=toScreen(0,0);
  ctx.beginPath(); ctx.moveTo(0,o.y); ctx.lineTo(rect.width,o.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(o.x,0); ctx.lineTo(o.x,rect.height); ctx.stroke();
}
let _cssCache={};
function getCss(varName){
  if(_cssCache[varName]) return _cssCache[varName];
  const v=getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  _cssCache[varName]=v; return v;
}
function clearCssCache(){ _cssCache={}; }

function drawElements(){
  elements.forEach(el=>{
    const a=getNode(el.n1), b=getNode(el.n2);
    const pa=toScreen(a.x,a.y), pb=toScreen(b.x,b.y);
    const isSel = isElementSelected(el.id);
    const isHov = hoverElemId===el.id;
    ctx.lineWidth = isSel?4.5:(isHov?4:3);
    ctx.strokeStyle = isSel? getCss('--accent-dark') : (isHov? getCss('--accent') : getCss('--ink'));
    if(showDeform && diagrams) ctx.globalAlpha=0.35;
    ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
    ctx.globalAlpha=1;
    // hinge markers
    const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
    const off=14/view.scale;
    if(el.hingeStart){ const p=elemBasePoint(a,ux,uy, off); drawHinge(toScreen(p.x,p.y)); }
    if(el.hingeEnd){ const p=elemBasePoint(a,ux,uy, L-off); drawHinge(toScreen(p.x,p.y)); }
    if(isSel && selection.elemIds.length===1){
      // local "top"(+y) indicator — only drawn for a single-element selection to avoid
      // cluttering the drawing with one dashed marker per bar during a bulk selection
      const midx=(a.x+b.x)/2, midy=(a.y+b.y)/2;
      const nx=-uy, ny=ux;
      const p0=toScreen(midx,midy), p1=toScreen(midx+nx*0.6, midy+ny*0.6);
      ctx.save(); ctx.setLineDash([3,3]); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke(); ctx.restore();
      ctx.fillStyle=getCss('--ink-soft'); ctx.font='10px '+FONT_SANS; ctx.textAlign='center';
      ctx.fillText('góra', p1.x, p1.y-4);
    }
  });
}
function drawHinge(p){
  ctx.beginPath(); ctx.arc(p.x,p.y,4.5,0,7); ctx.fillStyle=getCss('--surface'); ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=getCss('--ink'); ctx.stroke();
}

function drawNodes(){
  const draggedObj = (dragNode!=null) ? getNode(dragNode) : null;
  nodes.forEach(n=>{
    const p=toScreen(n.x,n.y);
    const isSel = isNodeSelected(n.id);
    const isHov = hoverNodeId===n.id;
    const isBarStart = mode==='addBar' && barStart===n.id;
    if(isBarStart){
      ctx.beginPath(); ctx.arc(p.x,p.y,11,0,7);
      ctx.strokeStyle=getCss('--react-color'); ctx.lineWidth=2.4; ctx.setLineDash([3,2]); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(p.x,p.y,7.5,0,7);
      ctx.fillStyle=getCss('--react-color'); ctx.fill();
      ctx.lineWidth=1.5; ctx.strokeStyle=getCss('--bg-canvas'); ctx.stroke();
      return;
    }
    const isSnapTarget = (draggedObj && n.id!==draggedObj.id && Math.hypot(n.x - draggedObj.x, n.y - draggedObj.y) < 1e-4);
    if(isSnapTarget){
      ctx.save();
      ctx.beginPath(); ctx.arc(p.x,p.y,12,0,7);
      ctx.strokeStyle=getCss('--accent'); ctx.lineWidth=2; ctx.setLineDash([3,2]); ctx.stroke();
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(p.x,p.y, isSel?7:(isHov?6.5:5.5),0,7);
    ctx.fillStyle = isSel? getCss('--accent-dark') : (isHov? getCss('--accent') : getCss('--ink'));
    ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle=getCss('--bg-canvas'); ctx.stroke();
  });
}

function rot(x,y,ang){ const c=Math.cos(ang), s=Math.sin(ang); return {x:x*c-y*s, y:x*s+y*c}; }

function drawSupports(){
  nodes.forEach(n=>{
    if(!n.support) return;
    const sp=n.support;
    const p=toScreen(n.x,n.y);
    const angRad = -(sp.angleDeg||0)*Math.PI/180; // canvas rotate convention (see notes)
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(angRad);
    ctx.lineWidth=1.6; ctx.strokeStyle=getCss('--ink'); ctx.fillStyle=getCss('--surface-2');
    const ux=dirType(sp.ux), uy=dirType(sp.uy), rz=dirType(sp.rz);
    const S=13; // symbol size px
    if (ux!=='free' && uy!=='free' && rz!=='free'){
      // full fixation -> wall hatch
      ctx.beginPath(); ctx.moveTo(-S,0); ctx.lineTo(S,0); ctx.stroke();
      for(let i=-S;i<=S;i+=5){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i-5,10); ctx.stroke(); }
    } else if(ux!=='free' && uy!=='free' && rz==='free'){
      // pin (triangle)
      drawTriangleDown(S);
      hatch(-S+3, S, S+3, S);
    } else if(uy!=='free' && ux==='free' && rz==='free'){
      // horizontal roller (restrains vertical)
      drawTriangleDown(S);
      ctx.beginPath(); ctx.arc(-S+4,S+4,3,0,7); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,S+4,3,0,7); ctx.stroke();
      ctx.beginPath(); ctx.arc(S-4,S+4,3,0,7); ctx.stroke();
    } else if(ux!=='free' && uy==='free' && rz==='free'){
      // vertical roller (restrains horizontal) - rotate triangle 90deg extra
      ctx.save(); ctx.rotate(Math.PI/2);
      drawTriangleDown(S);
      ctx.beginPath(); ctx.arc(-S+4,S+4,3,0,7); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,S+4,3,0,7); ctx.stroke();
      ctx.beginPath(); ctx.arc(S-4,S+4,3,0,7); ctx.stroke();
      ctx.restore();
    } else if(ux!=='free' && uy==='free' && rz!=='free'){
      // Łyżwa pionowa (zablokowany przesuw poziomy Ux i obrót Rz, wolny przesuw Uy)
      const d = 4, H = 13;
      ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, 7); ctx.fillStyle = getCss('--ink'); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-d, -H); ctx.lineTo(-d, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(d, -H); ctx.lineTo(d, H); ctx.stroke();
      for(let y = -H; y <= H; y += 6){
        ctx.beginPath(); ctx.moveTo(-d, y); ctx.lineTo(-d - 6, y + 6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(d, y); ctx.lineTo(d + 6, y - 6); ctx.stroke();
      }
    } else if(ux==='free' && uy!=='free' && rz!=='free'){
      // Łyżwa pozioma (zablokowany przesuw pionowy Uy i obrót Rz, wolny przesuw Ux)
      const H = 13;
      ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, 7); ctx.fillStyle = getCss('--ink'); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-H, 3); ctx.lineTo(H, 3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-H, 8); ctx.lineTo(H, 8); ctx.stroke();
      for(let x = -H; x <= H; x += 6){
        ctx.beginPath(); ctx.moveTo(x, 8); ctx.lineTo(x - 6, 14); ctx.stroke();
      }   
    } else if(ux==='free' && uy==='free' && rz!=='free'){
      // Łyżwa dwukierunkowa / tuleja (blokuje tylko obrót Rz)
      const S = 10;
      // Przegub w węźle
      ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, 7); ctx.fillStyle = getCss('--ink'); ctx.fill();
      
      // Obydwustronna kwadratowa tuleja
      ctx.beginPath(); ctx.rect(-S, -S, 2*S, 2*S); ctx.stroke();
      
      // Rolki po 4 stronach (symbolizujące swobodę przesuwu w X i Y)
      ctx.beginPath(); ctx.arc(-S-3, 0, 2.5, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(S+3, 0, 2.5, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -S-3, 2.5, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, S+3, 2.5, 0, 7); ctx.stroke();    
    } else { }
    // spring indicators overlay
    if(ux==='spring') drawSpringTick(-S-6,0,false);
    if(uy==='spring') drawSpringTick(0,S+3,true);
    if(rz==='spring') drawRotationalSpring(0, 0, S * 1.2);
    ctx.restore();
  });
}
function dirType(d){ return d? d.type : 'free'; }
function drawTriangleDown(S){
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-S,S); ctx.lineTo(S,S); ctx.closePath();
  ctx.fillStyle='#e2e8f0'; ctx.fill(); ctx.stroke();
}
function hatch(x0,y0,x1,y1){
  for(let t=0;t<=1;t+=0.18){ const x=x0+(x1-x0)*t; ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x-4,y0+7); ctx.stroke(); }
}
function drawSpringTick(x,y,vertical){
  ctx.save(); ctx.translate(x,y); ctx.strokeStyle='#7c3aed'; ctx.lineWidth=1.6;
  ctx.beginPath();
  if(vertical){ ctx.moveTo(0,0); for(let i=0;i<5;i++){ ctx.lineTo((i%2?4:-4), 4+i*4); } }
  else { ctx.moveTo(0,0); for(let i=0;i<5;i++){ ctx.lineTo(-4-i*4,(i%2?4:-4)); } }
  ctx.stroke(); ctx.restore();
}

function drawRotationalSpring(x, y, rMax) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = '#7c3aed';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  
  const turns = 2.5;                  // Liczba zwojów spirali
  const maxAngle = turns * 2 * Math.PI;
  const rMin = 2;                     // Promień wewnętrzny
  const step = 0.1;
  
  for (let a = 0; a <= maxAngle; a += step) {
    const r = rMin + (rMax - rMin) * (a / maxAngle);
    const px = r * Math.cos(a);
    const py = r * Math.sin(a);
    if (a === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  
  ctx.stroke();
  ctx.restore();
}

/* ---- loads ---- */
function drawArrow(fromX,fromY,toX,toY,color){
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(fromX,fromY); ctx.lineTo(toX,toY); ctx.stroke();
  const ang=Math.atan2(toY-fromY,toX-fromX);
  const ah=8;
  ctx.beginPath();
  ctx.moveTo(toX,toY);
  ctx.lineTo(toX-ah*Math.cos(ang-0.4), toY-ah*Math.sin(ang-0.4));
  ctx.lineTo(toX-ah*Math.cos(ang+0.4), toY-ah*Math.sin(ang+0.4));
  ctx.closePath(); ctx.fill();
}
// draws a curved-arrow moment indicator; ccw for M>=0. Shared by applied nodal
// moments and reaction moments (with a different radius so they don't collide).
function drawMomentArc(cx,cy,M,r,color,label,offsetDeg,labelAngleDeg){
  offsetDeg = offsetDeg||0;
  const ccw = M>=0;
  const visStart = (10+offsetDeg)*Math.PI/180;
  const sweep = (ccw?1:-1)*300*Math.PI/180;
  const visEnd = visStart+sweep;
  ctx.strokeStyle=color; ctx.lineWidth=2.2;
  ctx.beginPath();
  ctx.arc(cx,cy,r, -visStart, -visEnd, ccw);
  ctx.stroke();
  const ex=cx+r*Math.cos(visEnd), ey=cy-r*Math.sin(visEnd);
  const tangentVis = visEnd + (ccw?1:-1)*Math.PI/2;
  ctx.save(); ctx.translate(ex,ey); ctx.rotate(-tangentVis); ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-7,-4); ctx.lineTo(-7,4); ctx.closePath(); ctx.fill(); ctx.restore();
  if(label){
    ctx.font='11px '+FONT_MONO;
    const w=ctx.measureText(label).width;
    const pad=3;
    let tx, ty, align;
    if(labelAngleDeg != null){
      // Exact placement along a specified visual angle direction (e.g. toward element center)
      const lRad = -labelAngleDeg * Math.PI / 180;
      const lx = Math.cos(lRad), ly = Math.sin(lRad);
      const dist = r + 6;
      tx = cx + lx * dist;
      ty = cy + ly * dist;
      if(lx > 0.3) align = 'left';
      else if(lx < -0.3) align = 'right';
      else align = 'center';
      
      const rx = align === 'left' ? 0 : align === 'right' ? -w : -w/2;
      ctx.fillStyle=getCss('--badge-bg');
      ctx.fillRect(tx + rx - pad, ty - 8, w + 2*pad, 13);
      ctx.fillStyle=color; ctx.textAlign = align;
      ctx.fillText(label, tx, ty);
    } else {
      // Default nodal/reaction moment positioning: rotate the original (r+4,-r) offset
      const offRad=-offsetDeg*Math.PI/180, bx=r+4, by=-r;
      const rx=bx*Math.cos(offRad)-by*Math.sin(offRad), ry=bx*Math.sin(offRad)+by*Math.cos(offRad);
      tx=cx+rx; ty=cy+ry;
      ctx.fillStyle=getCss('--badge-bg');
      ctx.fillRect(rx<0 ? tx - w - pad : tx - pad, ty - 8, w + 2*pad, 13);
      ctx.fillStyle=color; ctx.textAlign = rx<0?'right':'left';
      ctx.fillText(label, tx, ty);
    }
  }
}

function drawLoads(){
  const FCOLOR='#dc2626', MCOLOR='#dc2626', QCOLOR='#0891b2', TCOLOR='#be185d';
  const MASS_COLOR = getCss('--mass-color') || '#0284c7';
  nodes.forEach(n=>{
    const p=toScreen(n.x,n.y);
    if(n.mass){
      const mx = n.mass.mx || 0, my = n.mass.my || 0, Im = n.mass.Im || 0;
      if(Math.abs(mx) > 1e-6 || Math.abs(my) > 1e-6 || Math.abs(Im) > 1e-6){
        ctx.save();
        // Kółeczko w węźle symbolizujące masę skupioną
        ctx.beginPath();
        ctx.arc(p.x, p.y, 11, 0, 2*Math.PI);
        ctx.strokeStyle = MASS_COLOR;
        ctx.lineWidth = 2;
        ctx.fillStyle = MASS_COLOR + '22';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(p.x, p.y, 14, 0, 2*Math.PI);
        ctx.strokeStyle = MASS_COLOR + '66';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 2]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Etykiety z wartościami mas
        const labels = [];
        if(Math.abs(mx - my) < 1e-6 && Math.abs(mx) > 1e-6 && Math.abs(Im) < 1e-6){
          labels.push(`m=${fmtSmart(mx)} kg`);
        } else {
          if(Math.abs(mx) > 1e-6) labels.push(`m_x=${fmtSmart(mx)} kg`);
          if(Math.abs(my) > 1e-6) labels.push(`m_y=${fmtSmart(my)} kg`);
          if(Math.abs(Im) > 1e-6) labels.push(`I_m=${fmtSmart(Im)} kg·m²`);
        }

        if(labels.length > 0){
          ctx.font = '10px ' + FONT_MONO;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          const startX = p.x + 18;
          const lineHeight = 13;
          const totalH = labels.length * lineHeight;
          const startY = p.y - (totalH / 2) + (lineHeight / 2);

          labels.forEach((lbl, i) => {
            const curY = startY + i * lineHeight;
            const w = ctx.measureText(lbl).width;
            ctx.fillStyle = getCss('--badge-bg');
            ctx.fillRect(startX - 2, curY - 6, w + 4, 12);
            ctx.fillStyle = MASS_COLOR;
            ctx.fillText(lbl, startX, curY);
          });
        }
        ctx.restore();
      }
    }
    if(n.force){
      const len=46;
      if(n.force.mode==='components'){
        // rysujemy składową poziomą i pionową osobno; pomijamy zerowe, ujemne
        // odwracają strzałkę w drugą stronę (analogicznie jak przy trybie kąta).
        const Fx=n.force.Fx||0, Fy=n.force.Fy||0;
        if(Math.abs(Fx)>1e-9){
          const sign = Fx>=0 ? 1 : -1;
          const dxs=sign, dys=0; // screen space
          drawArrow(p.x-dxs*len, p.y, p.x-dxs*10, p.y, FCOLOR);
          ctx.fillStyle=FCOLOR; ctx.font='11px '+FONT_MONO; ctx.textAlign = sign>0?'right':'left';
          ctx.fillText(fmtSmart(Fx)+' kN', p.x-dxs*len - sign*4, p.y-6);
        }
        if(Math.abs(Fy)>1e-9){
          const sign = Fy>=0 ? 1 : -1;
          const dxs=0, dys=-sign; // model +y up => screen y flipped
          drawArrow(p.x, p.y-dys*len, p.x, p.y-dys*10, FCOLOR);
          ctx.fillStyle=FCOLOR; ctx.font='11px '+FONT_MONO; ctx.textAlign='left';
          ctx.fillText(fmtSmart(Fy)+' kN', p.x+4, p.y-dys*len - sign*4);
        }
      } else {
        const a=(n.force.angle||0)*Math.PI/180;
        const sign = (n.force.F||0)>=0 ? 1 : -1;
        // arrow points TOWARD the node in the load direction (tip at node); negative
        // magnitude flips the whole arrow to the opposite side, not just its label.
        const dxs=sign*Math.cos(a), dys=-sign*Math.sin(a); // screen space (y flip)
        drawArrow(p.x-dxs*len, p.y-dys*len, p.x-dxs*10, p.y-dys*10, FCOLOR);
        ctx.fillStyle=FCOLOR; ctx.font='11px '+FONT_MONO; ctx.textAlign='left';
        ctx.fillText(fmtSmart(n.force.F)+' kN', p.x-dxs*len+4, p.y-dys*len-4);
      }
    }
    if(n.moment){
      drawMomentArc(p.x,p.y,n.moment.M,22,MCOLOR,fmtSmart(n.moment.M)+' kNm');
    }
  });
  elements.forEach(el=>{
    const a=getNode(el.n1), b=getNode(el.n2);
    if(!a || !b) return;
    const pa=toScreen(a.x,a.y), pb=toScreen(b.x,b.y);
    const dx=pb.x-pa.x, dy=pb.y-pa.y;
    const Lpx=Math.hypot(dx,dy)||1;
    const ux=dx/Lpx, uy=dy/Lpx;
    const angDeg = Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI;

    // Moment za przegubem początkowym na pręcie
    if(el.hingeStart && el.momentHingeStart && Math.abs(el.momentHingeStart) > 1e-6){
      const rArc = 14;
      // Przegub jest w odległości 14px od węzła pa, środek łuku o promieniu rArc przesunięty tak,
      // aby brzeg łuku idealnie stykał się z kółkiem przegubu (14px od węzła + rArc + 5px na obrys przegubu)
      const hingeOffPx = 14;
      const dist = Math.min(hingeOffPx + rArc + 4, Lpx * 0.45);
      const cx = pa.x + ux * dist;
      const cy = pa.y + uy * dist;
      // Przesunięcie kąta łuku o 180 stopni względem osi pręta, a etykieta wartości umieszczona w głąb pręta (angDeg)
      drawMomentArc(cx, cy, el.momentHingeStart, rArc, MCOLOR, fmtSmart(el.momentHingeStart) + ' kNm', angDeg + 180, angDeg);
    }
    // Moment przed przegubem końcowym na pręcie
    if(el.hingeEnd && el.momentHingeEnd && Math.abs(el.momentHingeEnd) > 1e-6){
      const rArc = 14;
      const hingeOffPx = 14;
      const dist = Math.min(hingeOffPx + rArc + 4, Lpx * 0.45);
      const cx = pb.x - ux * dist;
      const cy = pb.y - uy * dist;
      // Łuk od strony przegubu, etykieta wartości umieszczona w głąb pręta (angDeg + 180)
      drawMomentArc(cx, cy, el.momentHingeEnd, rArc, MCOLOR, fmtSmart(el.momentHingeEnd) + ' kNm', angDeg, angDeg + 180);
    }
  });
  elements.forEach(el=>{
    if(!el.q) return;
    const a=getNode(el.n1), b=getNode(el.n2);
    const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
    const ang=el.q.angle*Math.PI/180;
    const ldx=Math.cos(ang), ldy=-Math.sin(ang); // screen-space direction for a POSITIVE q value
    const n = Math.max(4, Math.min(14, Math.round(L*view.scale/38)));
    const maxLen=42, minLen=14;
    const qmax = Math.max(Math.abs(el.q.qStart), Math.abs(el.q.qEnd), 1e-9);
    const qmode = el.q.mode||'resultant';
    // For projected modes the arrowheads land on the bar's flat horizontal/vertical
    // *projection* (touching the real bar at its highest/leftmost point), not on its
    // actual sloped surface. Negative q flips the arrow to the OTHER side of that same
    // landing point (not just a longer/shorter arrow in the same direction) — so a load
    // that changes sign along its length draws as a clean bowtie pinching at zero,
    // matching standard drafting convention, instead of a one-sided dip.
    let landYFixed=null, landXFixed=null;
    const bothNegative = el.q.qStart<0 && el.q.qEnd<0;
    if(qmode==='vertical') landYFixed = toScreen(0, bothNegative? Math.min(a.y,b.y) : Math.max(a.y,b.y)).y;
    else if(qmode==='horizontal') landXFixed = toScreen(bothNegative? Math.max(a.x,b.x) : Math.min(a.x,b.x), 0).x;
    let tailPts=[], signDirs=[];
    for(let i=0;i<=n;i++){
      const t=i/n;
      const qx=a.x+dx*t, qy=a.y+dy*t;
      const qval = el.q.qStart+(el.q.qEnd-el.q.qStart)*t;
      const sign = qval>=0 ? 1 : -1;
      const len = minLen + (maxLen-minLen)*Math.abs(qval)/qmax;
      const base=toScreen(qx,qy);
      let land;
      if(qmode==='vertical') land={x:base.x, y:landYFixed};
      else if(qmode==='horizontal') land={x:landXFixed, y:base.y};
      else land=base;
      const dirx=sign*ldx, diry=sign*ldy;
      const tail={x:land.x-dirx*len, y:land.y-diry*len};
      drawArrow(tail.x,tail.y, land.x-dirx*4, land.y-diry*4, QCOLOR);
      tailPts.push(tail); signDirs.push({x:dirx,y:diry});
    }
    ctx.strokeStyle=QCOLOR; ctx.lineWidth=1.3; ctx.setLineDash([3,2]);
    ctx.beginPath(); tailPts.forEach((pt,i)=> i? ctx.lineTo(pt.x,pt.y): ctx.moveTo(pt.x,pt.y)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=QCOLOR; ctx.font='10.5px '+FONT_MONO; ctx.textAlign='center';
    ctx.fillText(fmtSmart(el.q.qStart), tailPts[0].x-signDirs[0].x*11, tailPts[0].y-signDirs[0].y*11);
    ctx.fillText(fmtSmart(el.q.qEnd), tailPts[n].x-signDirs[n].x*11, tailPts[n].y-signDirs[n].y*11);
  });
  elements.forEach(el=>{
    if(!el.thermal) return;
    const a=getNode(el.n1), b=getNode(el.n2);
    const pa=toScreen(a.x,a.y), pb=toScreen(b.x,b.y);
    const dx=pb.x-pa.x, dy=pb.y-pa.y;
    const screenLen=Math.hypot(dx,dy)||1;
    const midx=(pa.x+pb.x)/2, midy=(pa.y+pb.y)/2;

    let ang=Math.atan2(dy,dx);
    let flip=false;
    // Obrót tekstu tak, aby był zawsze czytelny od lewej do prawej (-90° do 90°)
    if(ang > Math.PI/2 || ang < -Math.PI/2){
      ang += Math.PI;
      flip = true;
    }

    // Symetryczny odstęp w pikselach ekranu od osi pręta
    const offPx = 15;
    const topYLocal = flip ? offPx : -offPx;
    const botYLocal = flip ? -offPx : offPx;

    const textTop = 'Δtg=' + fmtSmart(el.thermal.dTtop) + '°C';
    const textBot = 'Δtd=' + fmtSmart(el.thermal.dTbottom) + '°C';

    ctx.save();
    ctx.translate(midx, midy);
    ctx.rotate(ang);

    ctx.font = '10.5px ' + FONT_MONO;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Tło dopasowane do koloru płótna
    const pad = 3;
    const wTop = ctx.measureText(textTop).width;
    ctx.fillStyle = getCss('--badge-bg');
    ctx.fillRect(-wTop/2 - pad, topYLocal - 6, wTop + 2*pad, 12);
    ctx.fillStyle = TCOLOR;
    ctx.fillText(textTop, 0, topYLocal);

    const wBot = ctx.measureText(textBot).width;
    ctx.fillStyle = getCss('--badge-bg');
    ctx.fillRect(-wBot/2 - pad, botYLocal - 6, wBot + 2*pad, 12);
    ctx.fillStyle = TCOLOR;
    ctx.fillText(textBot, 0, botYLocal);

    ctx.restore();
  });
}

/* ---- deformation ---- */
function drawDeformedShape(){
  if(!diagrams) return;
  const scale = autoDeform*deformMult;
  ctx.strokeStyle = getCss('--def-color'); ctx.lineWidth=2.6; ctx.setLineDash([]);
  elements.forEach(el=>{
    const dg=diagrams[el.id]; if(!dg) return;
    ctx.beginPath();
    dg.pts.forEach((pr,i)=>{
      const base=elemBasePoint(dg.n1,dg.c,dg.s,pr.x);
      const gx=base.x+pr.Ux_global*scale, gy=base.y+pr.Uy_global*scale;
      const p=toScreen(gx,gy);
      if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
    });
    ctx.stroke();
  });
}

/* ---- internal force / stress diagrams ---- */
function diagramColor(type){
  return {N:getCss('--n-color'), T:getCss('--t-color'), M:getCss('--m-color'), S:getCss('--s-color')}[type];
}
function drawDiagramType(type){
  if(!diagrams) return;
  const color = diagramColor(type);
  const scale = type==='N'? autoDiagN*diagMult : type==='T'? autoDiagT*diagMult : type==='M'? autoDiagM*diagMult : autoDiagS*diagMult;
  ctx.font='10px '+FONT_MONO;
  elements.forEach(el=>{
    const dg=diagrams[el.id]; if(!dg) return;
    const nx=-dg.s, ny=dg.c; // local +y (model coords) - offset direction
    let baseline=[], offsetLine=[];
    dg.pts.forEach(pr=>{
      const base=elemBasePoint(dg.n1,dg.c,dg.s,pr.x);
      let val;
      if(type==='N') val=pr.N; else if(type==='T') val=pr.V; else if(type==='M') val=-pr.M; else val=pr.sigTop;
      const ox=base.x+nx*val*scale, oy=base.y+ny*val*scale;
      baseline.push(toScreen(base.x,base.y));
      offsetLine.push(toScreen(ox,oy));
    });
    // filled band
    ctx.beginPath();
    baseline.forEach((p,i)=> i? ctx.lineTo(p.x,p.y): ctx.moveTo(p.x,p.y));
    for(let i=offsetLine.length-1;i>=0;i--) ctx.lineTo(offsetLine[i].x, offsetLine[i].y);
    ctx.closePath();
    ctx.fillStyle=color+'2e'; ctx.fill();
    ctx.strokeStyle=color; ctx.lineWidth=1.6;
    ctx.beginPath(); offsetLine.forEach((p,i)=> i? ctx.lineTo(p.x,p.y): ctx.moveTo(p.x,p.y)); ctx.stroke();
    // stress: also draw bottom fiber as dashed
    if(type==='S'){
      let offsetLine2=[];
      dg.pts.forEach(pr=>{
        const base=elemBasePoint(dg.n1,dg.c,dg.s,pr.x);
        const ox=base.x+nx*pr.sigBot*scale, oy=base.y+ny*pr.sigBot*scale;
        offsetLine2.push(toScreen(ox,oy));
      });
      ctx.setLineDash([4,3]); ctx.beginPath();
      offsetLine2.forEach((p,i)=> i? ctx.lineTo(p.x,p.y): ctx.moveTo(p.x,p.y)); ctx.stroke();
      ctx.setLineDash([]);
    }
    // labels at ends (skipped when negligible relative to this diagram's own magnitude)
    ctx.fillStyle=color; ctx.textAlign='center';
    const v0 = type==='N'?dg.pts[0].N:type==='T'?dg.pts[0].V:type==='M'?dg.pts[0].M:dg.pts[0].sigTop;
    const vE = type==='N'?dg.pts[dg.pts.length-1].N:type==='T'?dg.pts[dg.pts.length-1].V:type==='M'?dg.pts[dg.pts.length-1].M:dg.pts[dg.pts.length-1].sigTop;
    const mag = type==='N'?magN:type==='T'?magT:type==='M'?magM:magS;
    const getYOffset = (offY, baseY) => (offY < baseY ? -10 : 12);
    if(!isNegligible(v0,mag)) ctx.fillText(fmtSmart(v0), offsetLine[0].x, offsetLine[0].y + getYOffset(offsetLine[0].y, baseline[0].y));
    if(!isNegligible(vE,mag)) ctx.fillText(fmtSmart(vE), offsetLine[offsetLine.length-1].x, offsetLine[offsetLine.length-1].y + getYOffset(offsetLine[offsetLine.length-1].y, baseline[baseline.length-1].y));

    // label peak value along element if it exists in span
    let peakIdx = -1, maxPeakDiff = 0;
    for(let k = 1; k < dg.pts.length - 1; k++){
      const vk = type==='N'?dg.pts[k].N:type==='T'?dg.pts[k].V:type==='M'?dg.pts[k].M:dg.pts[k].sigTop;
      const diff = Math.abs(vk) - Math.max(Math.abs(v0), Math.abs(vE));
      if(diff > maxPeakDiff && ((vk > v0 && vk > vE) || (vk < v0 && vk < vE))){
        maxPeakDiff = diff;
        peakIdx = k;
      }
    }
    if(peakIdx > 0 && !isNegligible(maxPeakDiff, mag)){
      const vk = type==='N'?dg.pts[peakIdx].N:type==='T'?dg.pts[peakIdx].V:type==='M'?dg.pts[peakIdx].M:dg.pts[peakIdx].sigTop;
      ctx.fillText(fmtSmart(vk), offsetLine[peakIdx].x, offsetLine[peakIdx].y + getYOffset(offsetLine[peakIdx].y, baseline[peakIdx].y));
    }
  });
}

/* ---- influence-line diagrams (see FEM.solveInfluenceLine) ---- */
function ilDg(elId){
  if(!ilDiagrams) return null;
  return ilDiagrams.M[elId] || ilDiagrams.T[elId] || ilDiagrams.N[elId] || null;
}
function drawInfluenceLineType(type){
  if(!ilDiagrams || !ilDiagrams[type]) return;
  const color = diagramColor(type);
  const scale = type==='N'? autoDiagN*diagMult : type==='T'? autoDiagT*diagMult : autoDiagM*diagMult;
  ctx.font='10px '+FONT_MONO;
  elements.forEach(el=>{
    const dg=ilDiagrams[type][el.id]; if(!dg) return;
    const nx=-dg.s, ny=dg.c;
    let baseline=[], offsetLine=[];
    dg.pts.forEach(pr=>{
      const base=elemBasePoint(dg.n1,dg.c,dg.s,pr.x);
      const val=pr.v_local;
      const ox=base.x+nx*val*scale, oy=base.y+ny*val*scale;
      baseline.push(toScreen(base.x,base.y));
      offsetLine.push(toScreen(ox,oy));
    });
    ctx.beginPath();
    baseline.forEach((p,i)=> i? ctx.lineTo(p.x,p.y): ctx.moveTo(p.x,p.y));
    for(let i=offsetLine.length-1;i>=0;i--) ctx.lineTo(offsetLine[i].x, offsetLine[i].y);
    ctx.closePath();
    ctx.fillStyle=color+'2e'; ctx.fill();
    ctx.strokeStyle=color; ctx.lineWidth=1.6;
    ctx.beginPath(); offsetLine.forEach((p,i)=> i? ctx.lineTo(p.x,p.y): ctx.moveTo(p.x,p.y)); ctx.stroke();
    ctx.fillStyle=color; ctx.textAlign='center';
    const v0=dg.pts[0].v_local, vE=dg.pts[dg.pts.length-1].v_local;
    const mag = type==='N'?magN:type==='T'?magT:magM;
    const getYOffset = (offY, baseY) => (offY < baseY ? -10 : 12);
    if(!isNegligible(v0,mag)) ctx.fillText(fmtSmart(v0), offsetLine[0].x, offsetLine[0].y + getYOffset(offsetLine[0].y, baseline[0].y));
    if(!isNegligible(vE,mag)) ctx.fillText(fmtSmart(vE), offsetLine[offsetLine.length-1].x, offsetLine[offsetLine.length-1].y + getYOffset(offsetLine[offsetLine.length-1].y, baseline[baseline.length-1].y));
  });
}

/* ---- envelope diagrams ---- */
function drawEnvelopeDiagram(type){
  if(!solved || solved.type !== 'envelope' || !solved.envelopeData) return;
  const color = diagramColor(type);
  const scale = type==='N'? autoDiagN*diagMult : type==='T'? autoDiagT*diagMult : type==='M'? autoDiagM*diagMult : autoDiagS*diagMult;
  ctx.font = '10px ' + FONT_MONO;

  elements.forEach(el => {
    const env = solved.envelopeData[el.id];
    if(!env) return;
    const nx = -env.s, ny = env.c;
    const n1 = getNode(el.n1);
    let baseline = [], offsetLineMax = [], offsetLineMin = [];

    env.pts.forEach(pt => {
      const base = elemBasePoint(n1, env.c, env.s, pt.x);
      let vMax, vMin;
      if(type === 'M'){
        vMax = -pt.M_max;
        vMin = -pt.M_min;
      } else if(type === 'T'){
        vMax = pt.V_max;
        vMin = pt.V_min;
      } else if(type === 'N'){
        vMax = pt.N_max;
        vMin = pt.N_min;
      } else {
        vMax = Math.max(pt.sigTop_max, pt.sigBot_max);
        vMin = Math.min(pt.sigTop_min, pt.sigBot_min);
      }

      const pBase = toScreen(base.x, base.y);
      const pMax = toScreen(base.x + nx * vMax * scale, base.y + ny * vMax * scale);
      const pMin = toScreen(base.x + nx * vMin * scale, base.y + ny * vMin * scale);

      baseline.push(pBase);
      offsetLineMax.push(pMax);
      offsetLineMin.push(pMin);
    });

    ctx.beginPath();
    offsetLineMax.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    for(let i = offsetLineMin.length - 1; i >= 0; i--){
      ctx.lineTo(offsetLineMin[i].x, offsetLineMin[i].y);
    }
    ctx.closePath();
    ctx.fillStyle = color + '30';
    ctx.fill();

    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    offsetLineMax.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.stroke();

    ctx.beginPath();
    offsetLineMin.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.stroke();

    ctx.save();
    ctx.strokeStyle = color + '66';
    ctx.lineWidth = 1.0;
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    baseline.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    const mag = type==='N'? magN : type==='T'? magT : type==='M'? magM : magS;

    const pt0 = env.pts[0];
    const ptE = env.pts[env.pts.length - 1];
    let val0Max = type==='M'? pt0.M_max : type==='T'? pt0.V_max : type==='N'? pt0.N_max : Math.max(pt0.sigTop_max, pt0.sigBot_max);
    let val0Min = type==='M'? pt0.M_min : type==='T'? pt0.V_min : type==='N'? pt0.N_min : Math.min(pt0.sigTop_min, pt0.sigBot_min);
    let valEMax = type==='M'? ptE.M_max : type==='T'? ptE.V_max : type==='N'? ptE.N_max : Math.max(ptE.sigTop_max, ptE.sigBot_max);
    let valEMin = type==='M'? ptE.M_min : type==='T'? ptE.V_min : type==='N'? ptE.N_min : Math.min(ptE.sigTop_min, ptE.sigBot_min);

    const drawLabel = (text, x, y, isAbove) => {
      const w = ctx.measureText(text).width;
      const yOff = isAbove ? -5 : 2;
      ctx.fillStyle = getCss('--badge-bg');
      ctx.fillRect(x - w/2 - 2, y + yOff - 5, w + 4, 11);
      ctx.fillStyle = color;
      ctx.fillText(text, x, y + yOff + 4);
    };

    if(!isNegligible(val0Max, mag)) drawLabel(fmtSmart(val0Max), offsetLineMax[0].x, offsetLineMax[0].y, offsetLineMax[0].y < baseline[0].y);
    if(!isNegligible(val0Min, mag) && Math.abs(val0Max - val0Min) > 1e-4) drawLabel(fmtSmart(val0Min), offsetLineMin[0].x, offsetLineMin[0].y, offsetLineMin[0].y < baseline[0].y);

    if(!isNegligible(valEMax, mag)) drawLabel(fmtSmart(valEMax), offsetLineMax[offsetLineMax.length-1].x, offsetLineMax[offsetLineMax.length-1].y, offsetLineMax[offsetLineMax.length-1].y < baseline[baseline.length-1].y);
    if(!isNegligible(valEMin, mag) && Math.abs(valEMax - valEMin) > 1e-4) drawLabel(fmtSmart(valEMin), offsetLineMin[offsetLineMin.length-1].x, offsetLineMin[offsetLineMin.length-1].y, offsetLineMin[offsetLineMin.length-1].y < baseline[baseline.length-1].y);

    let peakIdx = -1, peakDiff = 0;
    for(let k = 1; k < env.pts.length - 1; k++){
      const ptk = env.pts[k];
      const vK = type==='M'? ptk.M_max : type==='T'? ptk.V_max : type==='N'? ptk.N_max : Math.max(ptk.sigTop_max, ptk.sigBot_max);
      if(vK > val0Max && vK > valEMax && (vK - Math.max(val0Max, valEMax)) > peakDiff){
        peakDiff = vK - Math.max(val0Max, valEMax);
        peakIdx = k;
      }
    }
    if(peakIdx > 0 && !isNegligible(peakDiff, mag)){
      const ptPeak = env.pts[peakIdx];
      const vPeak = type==='M'? ptPeak.M_max : type==='T'? ptPeak.V_max : type==='N'? ptPeak.N_max : Math.max(ptPeak.sigTop_max, ptPeak.sigBot_max);
      drawLabel(fmtSmart(vPeak), offsetLineMax[peakIdx].x, offsetLineMax[peakIdx].y, offsetLineMax[peakIdx].y < baseline[peakIdx].y);
    }
  });
}

function setEnvelopeReactionMode(mode){
  envelopeReactionMode = mode;
  showReactions = (mode !== 'off');
  if(lastResultViewsPerType.envelope){
    lastResultViewsPerType.envelope.reactionMode = mode;
    lastResultViewsPerType.envelope.showReactions = showReactions;
  }
  renderSidebar();
  render();
}

function drawEnvelopeReactions(){
  if(!solved || !solved.reactionsEnvelope || envelopeReactionMode === 'off' || !showReactions) return;
  ctx.font='10.5px '+FONT_MONO;
  const RC=getCss('--react-color');
  const gap=26, len=32;
  nodes.forEach(n=>{
    const renv = solved.reactionsEnvelope[n.id];
    if(!renv || !n.support) return;
    const p = toScreen(n.x, n.y);
    const angDeg = n.support.angleDeg || 0, angRad = angDeg * Math.PI / 180;
    const c = Math.cos(angRad), s = Math.sin(angRad);

    if(envelopeReactionMode === 'range'){
      const hasRy = (Math.abs(renv.Ry_max) > 1e-6 || Math.abs(renv.Ry_min) > 1e-6);
      const hasRx = (Math.abs(renv.Rx_max) > 1e-6 || Math.abs(renv.Rx_min) > 1e-6);
      const hasRm = (Math.abs(renv.Rm_max) > 1e-6 || Math.abs(renv.Rm_min) > 1e-6);

      if(hasRy){
        const rdx = -s, rdy = -c;
        const px = -rdx, py = -rdy;
        const head = { x: p.x + px * gap, y: p.y + py * gap };
        const tail = { x: p.x + px * (gap + len), y: p.y + py * (gap + len) };
        drawArrow(tail.x, tail.y, head.x, head.y, RC);
        const text = `Ry: [${fmtSmart(renv.Ry_min)} .. ${fmtSmart(renv.Ry_max)}] kN`;
        const w = ctx.measureText(text).width;
        ctx.fillStyle = getCss('--badge-bg');
        ctx.fillRect(tail.x + 4, tail.y - 6, w + 4, 12);
        ctx.fillStyle = RC; ctx.textAlign = 'left';
        ctx.fillText(text, tail.x + 6, tail.y + 3);
      }
      if(hasRx){
        const rdx = c, rdy = -s;
        const px = -rdx, py = -rdy;
        const head = { x: p.x + px * gap, y: p.y + py * gap };
        const tail = { x: p.x + px * (gap + len), y: p.y + py * (gap + len) };
        drawArrow(tail.x, tail.y, head.x, head.y, RC);
        const text = `Rx: [${fmtSmart(renv.Rx_min)} .. ${fmtSmart(renv.Rx_max)}] kN`;
        const w = ctx.measureText(text).width;
        ctx.fillStyle = getCss('--badge-bg');
        ctx.fillRect(tail.x - w - 6, tail.y - 6, w + 4, 12);
        ctx.fillStyle = RC; ctx.textAlign = 'right';
        ctx.fillText(text, tail.x - 4, tail.y + 3);
      }
      if(hasRm){
        const text = `M: [${fmtSmart(renv.Rm_min)} .. ${fmtSmart(renv.Rm_max)}] kNm`;
        drawMomentArc(p.x, p.y, renv.Rm_max, 22, RC, text, angDeg);
      }
    } else {
      const isMax = (envelopeReactionMode === 'max');
      const Rx = isMax ? renv.Rx_max : renv.Rx_min;
      const Ry = isMax ? renv.Ry_max : renv.Ry_min;
      const Rm = isMax ? renv.Rm_max : renv.Rm_min;
      const suffix = isMax ? 'max' : 'min';

      const Rlx = c * Rx + s * Ry;
      const Rly = -s * Rx + c * Ry;

      if(!isNegligible(Rlx, magReaction)){
        const sign = Rlx >= 0 ? 1 : -1;
        const rdx = sign * c, rdy = -sign * s;
        const px = -rdx, py = -rdy;
        const head = { x: p.x + px * gap, y: p.y + py * gap };
        const tail = { x: p.x + px * (gap + len), y: p.y + py * (gap + len) };
        drawArrow(tail.x, tail.y, head.x, head.y, RC);
        ctx.fillStyle = RC; ctx.textAlign = px < -0.2 ? 'right' : 'left';
        ctx.fillText(`Rx_${suffix} = ${fmtSmart(Rlx)} kN`, tail.x + px * 8, tail.y + py * 8 + 3);
      }
      if(!isNegligible(Rly, magReaction)){
        const sign = Rly >= 0 ? 1 : -1;
        const rdx = -sign * s, rdy = -sign * c;
        const px = -rdx, py = -rdy;
        const head = { x: p.x + px * gap, y: p.y + py * gap };
        const tail = { x: p.x + px * (gap + len), y: p.y + py * (gap + len) };
        drawArrow(tail.x, tail.y, head.x, head.y, RC);
        ctx.fillStyle = RC; ctx.textAlign = px < -0.2 ? 'right' : 'left';
        ctx.fillText(`Ry_${suffix} = ${fmtSmart(Rly)} kN`, tail.x + px * 8, tail.y + py * 8 + 3);
      }
      if(!isNegligible(Rm, magReaction)){
        drawMomentArc(p.x, p.y, Rm, 22, RC, `M_${suffix} = ${fmtSmart(Rm)} kNm`, angDeg);
      }
    }
  });
}
function drawILSectionMarker(){
  let targetElId, targetEnd;
  if(solved && solved.type==='influence'){
    targetElId = solved.ilElementId;
    targetEnd = solved.ilEnd;
  } else if(analysisSettings && analysisSettings.type==='influence'){
    const params = analysisSettings.params || {};
    targetElId = ilResolveElement(params);
    targetEnd = ilResolveEnd(params);
  } else {
    return;
  }

  if(targetElId == null) return;
  const el = getElement(targetElId);
  if(!el) return;
  const a = getNode(el.n1), b = getNode(el.n2);
  if(!a || !b) return;

  const dx = b.x - a.x, dy = b.y - a.y;
  const L = Math.hypot(dx, dy) || 1e-6;
  const c = dx / L, s = dy / L;
  const x = (targetEnd === 'end') ? L : 0;

  const base = elemBasePoint(a, c, s, x);
  const p = toScreen(base.x, base.y);
  const nx = -s, ny = c;
  const p1 = toScreen(base.x + nx * 0.35, base.y + ny * 0.35);
  const p2 = toScreen(base.x - nx * 0.35, base.y - ny * 0.35);

  ctx.save();
  ctx.strokeStyle = getCss('--accent'); ctx.lineWidth = 2.4; ctx.setLineDash([5, 3]);
  ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 7);
  ctx.fillStyle = getCss('--accent'); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.restore();
}

/* ---- probe marker ---- */
function drawProbeMarker(){
  if(probe.elId==null) return;
  const isEnv = solved && solved.type==='envelope';
  const isInf = solved && solved.type==='influence';
  const dg = isEnv ? (solved.envelopeData && solved.envelopeData[probe.elId]) : (isInf ? ilDg(probe.elId) : (diagrams? diagrams[probe.elId] : null));
  if(!dg) return;
  const el = getElement(probe.elId);
  if(!el) return;
  const n1 = getNode(el.n1);
  if(!n1) return;
  const x = probe.t*dg.L;
  const base = elemBasePoint(n1, dg.c, dg.s, x);
  const p=toScreen(base.x,base.y);
  ctx.beginPath(); ctx.arc(p.x,p.y,6,0,7);
  ctx.fillStyle='#0f172a'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
  ctx.beginPath(); ctx.arc(p.x,p.y,10,0,7); ctx.strokeStyle='#0f172a55'; ctx.lineWidth=1.5; ctx.stroke();
}

/* ---- reactions on canvas ---- */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawReactions(){
  if(!solved) return;
  if(solved.type === 'envelope'){
    drawEnvelopeReactions();
    return;
  }
  ctx.font='10.5px '+FONT_MONO;
  const RC=getCss('--react-color');
  const gap=26, len=32; // gap clears the support symbol; arrow tail sits gap+len away
  nodes.forEach(n=>{
    if(!n.support || solved.nodeIndex[n.id]==null) return;
    const idx=solved.nodeIndex[n.id];
    const Rx=solved.Rglobal[3*idx], Ry=solved.Rglobal[3*idx+1], Rm=solved.Rglobal[3*idx+2];
    if(isNegligible(Rx,magReaction) && isNegligible(Ry,magReaction) && isNegligible(Rm,magReaction)) return;
    const p=toScreen(n.x,n.y);
    const angDeg=n.support.angleDeg||0, angRad=angDeg*Math.PI/180;
    const c=Math.cos(angRad), s=Math.sin(angRad);
    const Rlx = c*Rx + s*Ry;
    const Rly = -s*Rx + c*Ry;
    if(!isNegligible(Rlx,magReaction)){
      const sign=Rlx>=0?1:-1;
      const rdx=sign*c, rdy=-sign*s;
      const px=-rdx, py=-rdy;
      const head={x:p.x+px*gap, y:p.y+py*gap};
      const tail={x:p.x+px*(gap+len), y:p.y+py*(gap+len)};
      drawArrow(tail.x,tail.y,head.x,head.y,RC);
      ctx.fillStyle=RC; ctx.textAlign = px<-0.2?'right':'left';
      ctx.fillText(fmtSmart(Rlx)+' kN', tail.x+px*8, tail.y+py*8+3);
    }
    if(!isNegligible(Rly,magReaction)){
      const sign=Rly>=0?1:-1;
      const rdx=-sign*s, rdy=-sign*c;
      const px=-rdx, py=-rdy;
      const head={x:p.x+px*gap, y:p.y+py*gap};
      const tail={x:p.x+px*(gap+len), y:p.y+py*(gap+len)};
      drawArrow(tail.x,tail.y,head.x,head.y,RC);
      ctx.fillStyle=RC; ctx.textAlign = px<-0.2?'right':'left';
      ctx.fillText(fmtSmart(Rly)+' kN', tail.x+px*8, tail.y+py*8+3);
    }
    if(!isNegligible(Rm,magReaction)){
      drawMomentArc(p.x,p.y,Rm,22,RC,fmtSmart(Rm)+' kNm', angDeg);
    }
  });
}


/* ---- rubber-band selection box overlay ---- */
function drawSelectionBox(){
  if(!boxSelectState || !boxSelectState.moved) return;
  const x0=Math.min(boxSelectState.startX,boxSelectState.curX), x1=Math.max(boxSelectState.startX,boxSelectState.curX);
  const y0=Math.min(boxSelectState.startY,boxSelectState.curY), y1=Math.max(boxSelectState.startY,boxSelectState.curY);
  const isWindow = boxSelectState.curX >= boxSelectState.startX;
  ctx.save();
  ctx.lineWidth=1.3;
  ctx.strokeStyle = getCss(isWindow? '--accent' : '--ok');
  ctx.setLineDash(isWindow? [] : [5,4]);
  ctx.globalAlpha=0.10;
  ctx.fillStyle = getCss(isWindow? '--accent' : '--ok');
  ctx.fillRect(x0,y0,x1-x0,y1-y0);
  ctx.globalAlpha=1;
  ctx.strokeRect(x0+0.5,y0+0.5,x1-x0,y1-y0);
  ctx.restore();
}

/* =========================================================================
   MAIN RENDER
   ========================================================================= */
function render(){
  if(!ctx) return;
  const rect=canvas.getBoundingClientRect();
  ctx.clearRect(0,0,rect.width,rect.height);
  ctx.fillStyle=getCss('--bg-canvas'); ctx.fillRect(0,0,rect.width,rect.height);
  if(showBackgroundGrid) drawGrid();
  const isInfluence = solved && solved.type==='influence';
  const isEnvelope = solved && solved.type==='envelope';
  const showingResults = showDeform||showM||showT||showN||showStress||showReactions;
  const hideLS = hideLoadsSupportsInResults && showingResults;
  if(showDeform && !isInfluence && !isEnvelope) drawDeformedShape();
  drawElements();
  if(isInfluence){
    if(showN) drawInfluenceLineType('N');
    if(showT) drawInfluenceLineType('T');
    if(showM) drawInfluenceLineType('M');
  } else if(isEnvelope){
    if(showN) drawEnvelopeDiagram('N');
    if(showT) drawEnvelopeDiagram('T');
    if(showM) drawEnvelopeDiagram('M');
    if(showStress) drawEnvelopeDiagram('S');
  } else {
    if(showN) drawDiagramType('N');
    if(showT) drawDiagramType('T');
    if(showM) drawDiagramType('M');
    if(showStress) drawDiagramType('S');
  }
  if(!hideLS) drawSupports();
  if(!hideLS && !isEnvelope) drawLoads();
  drawNodes();
  if(showIdLabels) drawIdLabels();
  if(showDimensionLines) drawModelDimensionLines();
  if(showReactions && !isInfluence) drawReactions();
  drawILSectionMarker();
  if(probe.elId!=null && (diagrams || (isInfluence && ilDiagrams) || (isEnvelope && solved && solved.envelopeData))) drawProbeMarker();
  drawTransientOverlays();
  drawScaleBar();
  drawSelectionBox();
}

/* ---- tymczasowe podglądy: współrzędne węzła + linie wymiarowe pręta ----
   Pokazywane po narysowaniu węzła/pręta (znikają przy kolejnej akcji) oraz
   na żywo podczas przenoszenia węzła (współrzędne + wymiary wszystkich
   prętów zbiegających się w tym węźle). ---- */
function connectedElements(nodeId){
  return elements.filter(e=>e.n1===nodeId || e.n2===nodeId);
}
function drawNodeCoordTip(nodeId){
  const n=getNode(nodeId); if(!n) return;
  const p=toScreen(n.x,n.y);
  const label = `(${fmt(n.x,2)}, ${fmt(n.y,2)})`;
  ctx.save();
  ctx.font='11.5px '+FONT_MONO;
  const w=ctx.measureText(label).width;
  const padH=6, h=18;
  const gap=34; // odstęp od węzła, żeby palec na ekranie dotykowym (zwykle poniżej punktu dotyku) go nie zasłaniał
  const cx=p.x, cy=p.y-gap-h; // wyśrodkowane poziomo, nad węzłem
  const bx=cx-w/2-padH, by=cy;
  ctx.fillStyle=DIMCOLOR;
  roundRect(bx,by,w+2*padH,h,4); ctx.fill();
  // „ogonek” wskazujący w dół, sięgający bezpośrednio do węzła
  const nodeRadius = isNodeSelected(nodeId) ? 7 : 5.5;
  ctx.beginPath();
  ctx.moveTo(cx-5, by+h);
  ctx.lineTo(cx, p.y - nodeRadius - 1);
  ctx.lineTo(cx+5, by+h);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, cx, by+h/2);
  ctx.restore();
}
function drawSingleDimension(el){
  const a=getNode(el.n1), b=getNode(el.n2); if(!a||!b) return;
  const pa=toScreen(a.x,a.y), pb=toScreen(b.x,b.y);
  const dx=pb.x-pa.x, dy=pb.y-pa.y;
  const segLen=Math.hypot(dx,dy)||1;
  const ux=dx/segLen, uy=dy/segLen;
  const nx=-uy, ny=ux; // kierunek prostopadły w przestrzeni ekranu
  const offset=24;
  const oa={x:pa.x+nx*offset, y:pa.y+ny*offset};
  const ob={x:pb.x+nx*offset, y:pb.y+ny*offset};
  ctx.save();
  ctx.strokeStyle=DIMCOLOR; ctx.fillStyle=DIMCOLOR;
  // linie pomocnicze od węzłów do linii wymiarowej
  ctx.lineWidth=1; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(oa.x,oa.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pb.x,pb.y); ctx.lineTo(ob.x,ob.y); ctx.stroke();
  ctx.setLineDash([]);
  // linia wymiarowa
  ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(oa.x,oa.y); ctx.lineTo(ob.x,ob.y); ctx.stroke();
  // kreski końcowe
  const tick=4;
  ctx.beginPath(); ctx.moveTo(oa.x-ux*tick,oa.y-uy*tick); ctx.lineTo(oa.x+ux*tick,oa.y+uy*tick); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ob.x-ux*tick,ob.y-uy*tick); ctx.lineTo(ob.x+ux*tick,ob.y+uy*tick); ctx.stroke();
  // etykieta z długością
  const midx=(oa.x+ob.x)/2, midy=(oa.y+ob.y)/2;
  const label = fmt(elLength(el),2)+' m';
  ctx.font='11px '+FONT_MONO;
  const w=ctx.measureText(label).width;
  const padH=5, h=15;
  ctx.fillStyle=DIMCOLOR;
  roundRect(midx-w/2-padH, midy-h/2, w+2*padH, h, 4); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, midx, midy);
  ctx.restore();
}
function drawElementDimensions(elsArr){ elsArr.forEach(drawSingleDimension); }
function drawModelDimensionLines(){
  if(!nodes || nodes.length < 2) return;

  const xsRaw = Array.from(new Set(nodes.map(n => Math.round(n.x * 1000) / 1000))).sort((a,b) => a - b);
  const xs = [];
  xsRaw.forEach(x => {
    if(xs.length === 0 || x - xs[xs.length - 1] > 1e-4){
      xs.push(x);
    }
  });

  const ysRaw = Array.from(new Set(nodes.map(n => Math.round(n.y * 1000) / 1000))).sort((a,b) => a - b);
  const ys = [];
  ysRaw.forEach(y => {
    if(ys.length === 0 || y - ys[ys.length - 1] > 1e-4){
      ys.push(y);
    }
  });

  if(xs.length < 2 && ys.length < 2) return;

  ctx.save();
  ctx.strokeStyle = DIMCOLOR;
  ctx.fillStyle = DIMCOLOR;

  // --- HORIZONTAL DIMENSION LINES (below model) ---
  if(xs.length >= 2){
    const minY = Math.min(...nodes.map(n => n.y));
    const pMinY = toScreen(0, minY).y;
    const horizOffsetPx = 42;
    const dimY = pMinY + horizOffsetPx;

    const drawHorizSeg = (x1, x2, levelY) => {
      const L = x2 - x1;
      if(L < 1e-4) return;
      const paX = toScreen(x1, 0).x;
      const pbX = toScreen(x2, 0).x;

      const nodesAtX1 = nodes.filter(n => Math.abs(n.x - x1) < 1e-4);
      const nodesAtX2 = nodes.filter(n => Math.abs(n.x - x2) < 1e-4);
      const startY1 = nodesAtX1.length ? Math.min(...nodesAtX1.map(n => n.y)) : minY;
      const startY2 = nodesAtX2.length ? Math.min(...nodesAtX2.map(n => n.y)) : minY;

      const pStartY1 = toScreen(0, startY1).y;
      const pStartY2 = toScreen(0, startY2).y;

      ctx.lineWidth = 1;
      ctx.setLineDash([2, 3]);
      ctx.beginPath();
      ctx.moveTo(paX, pStartY1 + 6);
      ctx.lineTo(paX, levelY + 5);
      ctx.moveTo(pbX, pStartY2 + 6);
      ctx.lineTo(pbX, levelY + 5);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(paX, levelY);
      ctx.lineTo(pbX, levelY);
      ctx.stroke();

      const tick = 4;
      ctx.beginPath();
      ctx.moveTo(paX - tick, levelY - tick);
      ctx.lineTo(paX + tick, levelY + tick);
      ctx.moveTo(pbX - tick, levelY - tick);
      ctx.lineTo(pbX + tick, levelY + tick);
      ctx.stroke();

      const midx = (paX + pbX) / 2;
      const label = fmt(L, 2) + ' m';
      ctx.font = '11px ' + FONT_MONO;
      const w = ctx.measureText(label).width;
      const padH = 5, h = 15;
      ctx.fillStyle = DIMCOLOR;
      roundRect(midx - w/2 - padH, levelY - h/2, w + 2*padH, h, 4);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, midx, levelY);
      ctx.fillStyle = DIMCOLOR;
    };

    for(let i = 0; i < xs.length - 1; i++){
      drawHorizSeg(xs[i], xs[i+1], dimY);
    }

    if(xs.length > 2){
      drawHorizSeg(xs[0], xs[xs.length - 1], dimY + 35);
    }
  }

  // --- VERTICAL DIMENSION LINES (to the right of model) ---
  if(ys.length >= 2){
    const maxX = Math.max(...nodes.map(n => n.x));
    const pMaxX = toScreen(maxX, 0).x;
    const vertOffsetPx = 45;
    const dimX = pMaxX + vertOffsetPx;

    const drawVertSeg = (y1, y2, levelX) => {
      const H = y2 - y1;
      if(H < 1e-4) return;
      const paY = toScreen(0, y1).y;
      const pbY = toScreen(0, y2).y;

      const nodesAtY1 = nodes.filter(n => Math.abs(n.y - y1) < 1e-4);
      const nodesAtY2 = nodes.filter(n => Math.abs(n.y - y2) < 1e-4);
      const startX1 = nodesAtY1.length ? Math.max(...nodesAtY1.map(n => n.x)) : maxX;
      const startX2 = nodesAtY2.length ? Math.max(...nodesAtY2.map(n => n.x)) : maxX;

      const pStartX1 = toScreen(startX1, 0).x;
      const pStartX2 = toScreen(startX2, 0).x;

      ctx.lineWidth = 1;
      ctx.setLineDash([2, 3]);
      ctx.beginPath();
      ctx.moveTo(pStartX1 + 6, paY);
      ctx.lineTo(levelX + 5, paY);
      ctx.moveTo(pStartX2 + 6, pbY);
      ctx.lineTo(levelX + 5, pbY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(levelX, paY);
      ctx.lineTo(levelX, pbY);
      ctx.stroke();

      const tick = 4;
      ctx.beginPath();
      ctx.moveTo(levelX - tick, paY + tick);
      ctx.lineTo(levelX + tick, paY - tick);
      ctx.moveTo(levelX - tick, pbY + tick);
      ctx.lineTo(levelX + tick, pbY - tick);
      ctx.stroke();

      const midy = (paY + pbY) / 2;
      const label = fmt(H, 2) + ' m';
      ctx.font = '11px ' + FONT_MONO;
      const w = ctx.measureText(label).width;
      const padH = 5, h = 15;
      ctx.fillStyle = DIMCOLOR;
      roundRect(levelX - w/2 - padH, midy - h/2, w + 2*padH, h, 4);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, levelX, midy);
      ctx.fillStyle = DIMCOLOR;
    };

    for(let j = 0; j < ys.length - 1; j++){
      drawVertSeg(ys[j], ys[j+1], dimX);
    }

    if(ys.length > 2){
      drawVertSeg(ys[0], ys[ys.length - 1], dimX + 50);
    }
  }

  ctx.restore();
}

function niceScaleValue(maxPx,pxPerMeter){
  const steps=[0.1,0.2,0.25,0.5,1,2,2.5,5,10,20,25,50,100,200,250,500,1000,2000,5000,10000];
  let best=steps[0];
  for(const s of steps){ if(s*pxPerMeter<=maxPx) best=s; else break; }
  return best;
}
function drawScaleBar(){
  const rect = canvas.getBoundingClientRect();
  const maxPx = 120;
  const val = niceScaleValue(maxPx, view.scale);
  const barPx = val * view.scale;
  
  // Pobieramy aktualną wysokość paska statusu z DOM
  const statusbarEl = document.getElementById('statusbar');

  const x0 = marginLeft, x1 = marginLeft + barPx;

  ctx.font = '10.5px ' + FONT_MONO;
  ctx.strokeStyle = getCss('--ink'); 
  ctx.lineWidth = 1.6;
