function catalogSizeLabel(kind,t){
  return kind==='angle' ? t.name : `${t.name} (h=${t.h}×b=${t.b} cm)`;
}
function catalogFieldsHtml(){
  const catType=newSecCatalogTypeState, def=CATALOG_DEFS[catType];
  const showMirror = (def.kind==='tee' || def.kind==='angle');
  return `<div class="row"><label>Profil</label><select id="newSecCatType" onchange="onCatalogTypeChange()">
      ${CATALOG_ORDER.map(k=>`<option value="${k}" ${k===catType?'selected':''}>${CATALOG_DEFS[k].label}</option>`).join('')}
    </select></div>
    <div class="row"><label>Rozmiar</label><select id="newSecCatSize" onchange="onCatalogSizeChange()">
      ${def.data.map((t,i)=>`<option value="${i}">${catalogSizeLabel(def.kind,t)}</option>`).join('')}
    </select></div>
    ${showMirror? `<div class="checkline"><input type="checkbox" id="newSecCatMirror" onchange="onCatalogSizeChange()"> Odwrócony</div>
    <div class="muted">Przekrój niesymetryczny — zaznacz, aby odwrócić orientację względem osi pręta.</div>` : ''}
    <div id="newSecPreview"></div>`;
}
function onCatalogTypeChange(){
  newSecCatalogTypeState=document.getElementById('newSecCatType').value;
  document.getElementById('newSecSubFields').innerHTML=catalogFieldsHtml();
  refreshSecName(); updateSecPreview();
}
function onCatalogSizeChange(){ refreshSecName(); updateSecPreview(); }
function refreshSecName(){
  const nameInput=document.getElementById('newSecName');
  if(!nameInput || newSecCategoryState!=='katalog') return;
  const def=CATALOG_DEFS[newSecCatalogTypeState];
  const sizeSel=document.getElementById('newSecCatSize'); if(!sizeSel) return;
  const idx=parseInt(sizeSel.value)||0;
  const mirrorEl=document.getElementById('newSecCatMirror');
  const mirror = mirrorEl? mirrorEl.checked : false;
  nameInput.value = def.data[idx].name + (mirror? ' (odwrócony)':'');
}
function computeCatalogGeom(){
  const catType=newSecCatalogTypeState, def=CATALOG_DEFS[catType];
  const idx=parseInt(document.getElementById('newSecCatSize').value)||0;
  const t=def.data[idx];
  const mirrorEl=document.getElementById('newSecCatMirror');
  const mirror = mirrorEl? mirrorEl.checked : false;
  if(def.kind==='sym'){
    return {A:t.A,I:t.Ix,h:t.h,cTop:t.h/2,cBot:t.h/2,bw:t.b,
      extra:{catType,catIdx:idx,catalog:t.name,drawKind:def.draw,tf:t.tf,tw:t.tw}};
  }
  if(def.kind==='tee'){
    const e1=t.Ix/t.Wx1, e2=t.Ix/t.Wx2; // e1: bliżej stopki, e2: bliżej końca środnika
    const cTop = mirror? e2 : e1, cBot = mirror? e1 : e2;
    return {A:t.A,I:t.Ix,h:t.h,cTop,cBot,bw:t.b,
      extra:{catType,catIdx:idx,catalog:t.name,mirrored:mirror,drawKind:def.draw,tf:t.s,tw:t.s}};
  }
  // kątownik (angle)
  const cTop = mirror? t.zs : (t.h-t.zs), cBot = mirror? (t.h-t.zs) : t.zs;
  return {A:t.A,I:t.Ix,h:t.h,cTop,cBot,bw:t.h,
    extra:{catType,catIdx:idx,catalog:t.name,mirrored:mirror,drawKind:def.draw,t:t.t}};
}

    <div id="newSecPreview"></div>`;
  if(shape==='circ') return `<div class="row"><label>Średnica d</label><input type="number" step="1" id="newSecD" value="30" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div id="newSecPreview"></div>`;
  if(shape==='pipe') return `<div class="row"><label>Śr. zewn. D</label><input type="number" step="0.5" id="newSecPipeD" value="20" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Grubość ścianki t</label><input type="number" step="0.1" id="newSecPipeT" value="0.8" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div id="newSecPreview"></div>`;
  if(shape==='box') return `<div class="row"><label>Wys. zewn. H</label><input type="number" step="0.5" id="newSecBoxH" value="20" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Szer. zewn. B</label><input type="number" step="0.5" id="newSecBoxB" value="12" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Grubość ścianki t</label><input type="number" step="0.1" id="newSecBoxT" value="0.6" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="muted">Grubość jednakowa na wszystkich ściankach.</div>
    <div id="newSecPreview"></div>`;
  if(shape==='ibeam') return `<div class="row"><label>Wysokość h</label><input type="number" step="0.5" id="newSecIH" value="20" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Szerokość b</label><input type="number" step="0.5" id="newSecIB" value="12" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Grub. stopki tf</label><input type="number" step="0.1" id="newSecITf" value="1.0" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Grub. środnika tw</label><input type="number" step="0.1" id="newSecITw" value="0.7" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="muted">Przekrój symetryczny (dwuteownik) — stopki jednakowe u góry i u dołu.</div>
    <div id="newSecPreview"></div>`;
  if(shape==='tee') return `<div class="row"><label>Wysokość h</label><input type="number" step="0.5" id="newSecTH" value="10" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Szerokość stopki b</label><input type="number" step="0.5" id="newSecTB" value="10" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Grub. stopki tf</label><input type="number" step="0.1" id="newSecTTf" value="1.0" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Grub. środnika tw</label><input type="number" step="0.1" id="newSecTTw" value="1.0" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="checkline"><input type="checkbox" id="newSecTMirror" onchange="updateSecPreview()"> Odwrócony (stopka na dole)</div>

  if(shape==='angle') return `<div class="row"><label>Dł. ramienia a</label><input type="number" step="0.5" id="newSecAA" value="8" onchange="updateSecPreview()"><span class="unit">cm</span></div>
    <div class="row"><label>Grubość t</label><input type="number" step="0.1" id="newSecAT" value="0.8" onchange="updateSecPreview()"><span class="unit">cm</span></div>

function onNewSecShapeChange(){
  newSecShapeState=document.getElementById('newSecShape').value;
  document.getElementById('newSecSubShapeFields').innerHTML = shapeFieldsHtml(newSecShapeState);
  updateSecPreview();
}
function computeShapeGeom(shape){
  if(shape==='rect'){
    const b=parseFloat(document.getElementById('newSecB').value)||1, hh=parseFloat(document.getElementById('newSecH').value)||1;
    const A=b*hh, I=b*Math.pow(hh,3)/12;
    return {A,I,h:hh,cTop:hh/2,cBot:hh/2,bw:b,extra:{b,hh,drawKind:'rect'}};
  }
  if(shape==='circ'){
    const d=parseFloat(document.getElementById('newSecD').value)||1;
    const A=Math.PI*d*d/4, I=Math.PI*Math.pow(d,4)/64;
    return {A,I,h:d,cTop:d/2,cBot:d/2,bw:d,extra:{d,drawKind:'circle'}};
  }
  if(shape==='pipe'){
    const D=Math.max(parseFloat(document.getElementById('newSecPipeD').value)||1, 0.2);
    const t=Math.max(0.05, Math.min(parseFloat(document.getElementById('newSecPipeT').value)||0.1, D/2-0.05));
    const Di=D-2*t;
    const A=Math.PI/4*(D*D-Di*Di), I=Math.PI/64*(Math.pow(D,4)-Math.pow(Di,4));
    return {A,I,h:D,cTop:D/2,cBot:D/2,bw:D,extra:{D,t,drawKind:'ring'}};
  }
  if(shape==='box'){
    const H=Math.max(parseFloat(document.getElementById('newSecBoxH').value)||1, 0.2);
    const B=Math.max(parseFloat(document.getElementById('newSecBoxB').value)||1, 0.2);
    const t=Math.max(0.05, Math.min(parseFloat(document.getElementById('newSecBoxT').value)||0.1, Math.min(H,B)/2-0.05));
    const Hi=H-2*t, Bi=B-2*t;
    const A=B*H-Bi*Hi, I=(B*Math.pow(H,3)-Bi*Math.pow(Hi,3))/12;
    return {A,I,h:H,cTop:H/2,cBot:H/2,bw:B,extra:{B,H,t,drawKind:'tube'}};
  }
  if(shape==='ibeam'){
    const h=Math.max(parseFloat(document.getElementById('newSecIH').value)||1, 0.2);
    const b=Math.max(parseFloat(document.getElementById('newSecIB').value)||1, 0.2);
    const tf=Math.max(0.05, Math.min(parseFloat(document.getElementById('newSecITf').value)||0.1, h/2-0.05));
    const tw=Math.max(0.05, Math.min(parseFloat(document.getElementById('newSecITw').value)||0.1, b-0.05));
    const A=2*b*tf + tw*(h-2*tf);
    const I=(b*Math.pow(h,3) - (b-tw)*Math.pow(h-2*tf,3))/12;
    return {A,I,h,cTop:h/2,cBot:h/2,bw:b,extra:{tf,tw,drawKind:'ibeam'}};
  }
  if(shape==='tee'){
    const h=Math.max(parseFloat(document.getElementById('newSecTH').value)||1, 0.2);
    const b=Math.max(parseFloat(document.getElementById('newSecTB').value)||1, 0.2);
    const tf=Math.max(0.05, Math.min(parseFloat(document.getElementById('newSecTTf').value)||0.1, h-0.05));
    const tw=Math.max(0.05, Math.min(parseFloat(document.getElementById('newSecTTw').value)||0.1, b-0.05));
    const mirror=document.getElementById('newSecTMirror').checked;
    const A1=b*tf, y1=h-tf/2;
    const A2=tw*(h-tf), y2=(h-tf)/2;
    const A=A1+A2;
    const ybar=(A1*y1+A2*y2)/A;
    const I1=b*Math.pow(tf,3)/12 + A1*Math.pow(y1-ybar,2);
    const I2=tw*Math.pow(h-tf,3)/12 + A2*Math.pow(y2-ybar,2);
    const I=I1+I2;
    const cTopRaw=h-ybar, cBotRaw=ybar; // domyślnie: stopka u góry (blisko centroidu)
    const cTop = mirror? cBotRaw : cTopRaw, cBot = mirror? cTopRaw : cBotRaw;
    return {A,I,h,cTop,cBot,bw:b,extra:{tf,tw,mirrored:mirror,drawKind:'tee'}};
  }
  // kątownik (angle) — parametryczny
  const a=Math.max(parseFloat(document.getElementById('newSecAA').value)||1, 0.2);
  const t=Math.max(0.05, Math.min(parseFloat(document.getElementById('newSecAT').value)||0.1, a/2-0.02));
  const mirror=document.getElementById('newSecAMirror').checked;
  const A=2*a*t - t*t;
  const ybar=(t/2)*(a*a + a*t - t*t)/A; // odległość środka ciężkości od naroża ramion
  const Ivert=t*Math.pow(a,3)/12 + t*a*Math.pow(a/2-ybar,2);
  const Ihoriz=(a-t)*Math.pow(t,3)/12 + (a-t)*t*Math.pow(t/2-ybar,2);
  const I=Ivert+Ihoriz;
  const cBotRaw=ybar, cTopRaw=a-ybar; // domyślnie: ramię poziome u dołu, blisko naroża
  const cTop = mirror? cBotRaw : cTopRaw, cBot = mirror? cTopRaw : cBotRaw;
  return {A,I,h:a,cTop,cBot,bw:a,extra:{t,mirrored:mirror,drawKind:'angle'}};
}

/* =========================================================================
   Kategoria 3: WŁASNY — wszystkie parametry wprowadzane ręcznie.
   ========================================================================= */
function computeCustomGeom(){
  const A=parseFloat(document.getElementById('newSecA').value)||1;
  const I=parseFloat(document.getElementById('newSecI').value)||1;
  const cTop=parseFloat(document.getElementById('newSecEtop').value)||1;
  const cBot=parseFloat(document.getElementById('newSecEbot').value)||1;
  return {A,I,h:cTop+cBot,cTop,cBot,bw:Math.max(cTop+cBot,1)*0.6,extra:{drawKind:'custom'}};
}

      <div class="half"><label>e dół</label><div class="inp-unit"><input type="number" step="1" id="newSecEbot" value="15" onchange="updateSecPreview()"><span class="unit">cm</span></div></div>

}

function computeSecGeom(){
  if(newSecCategoryState==='katalog') return computeCatalogGeom();
  if(newSecCategoryState==='ksztalt') return computeShapeGeom(newSecShapeState);
  return computeCustomGeom();
}
/* ---- mały schematyczny SVG: kontur + kreskowana linia środka ciężkości + wymiary e_góra/e_dół ---- */
function renderSectionSvg(g){
  const VB_W=210, VB_H=150, padL=14, padR=64, padT=14, padB=14;
  const areaW=VB_W-padL-padR, areaH=VB_H-padT-padB;
  const ex=g.extra||{};
  const drawKind=ex.drawKind||'rect';
  let mode='rects', rects=null, bw=g.bw||1, H=(g.cTop+g.cBot)||1;
  if(drawKind==='rect'){ rects=[{x:0,y:0,w:ex.b,h:ex.hh}]; }
  else if(drawKind==='circle'){ mode='circle'; }
  else if(drawKind==='ring'){ mode='ring'; }
  else if(drawKind==='tube'){ mode='tube'; }
  else if(drawKind==='ibeam'){
    const tf=ex.tf, tw=ex.tw;
    rects=[{x:0,y:0,w:bw,h:tf},{x:(bw-tw)/2,y:tf,w:tw,h:H-2*tf},{x:0,y:H-tf,w:bw,h:tf}];
  } else if(drawKind==='channel'){
    const tf=ex.tf, tw=ex.tw;
    rects=[{x:0,y:0,w:tw,h:H},{x:0,y:0,w:bw,h:tf},{x:0,y:H-tf,w:bw,h:tf}];
  } else if(drawKind==='tee'){
    const tf=ex.tf, tw=ex.tw;
    rects = ex.mirrored?
      [{x:(bw-tw)/2,y:0,w:tw,h:H-tf},{x:0,y:H-tf,w:bw,h:tf}] :
      [{x:0,y:0,w:bw,h:tf},{x:(bw-tw)/2,y:tf,w:tw,h:H-tf}];
  } else if(drawKind==='angle'){
    const t=ex.t;
    rects = ex.mirrored?
      [{x:0,y:0,w:t,h:H},{x:0,y:0,w:bw,h:t}] :
      [{x:0,y:0,w:t,h:H},{x:0,y:H-t,w:bw,h:t}];
  } else { rects=[{x:0,y:0,w:bw,h:H}]; } // custom: generic box
  const scale=Math.max(0.1, Math.min(areaW/bw, areaH/H));
  const dw=bw*scale, dh=H*scale;
  const x0=padL+(areaW-dw)/2, y0=padT+(areaH-dh)/2;
  const toX=x=>(x0+x*scale).toFixed(1), toY=y=>(y0+y*scale).toFixed(1);
  const FILL='var(--accent-soft)', STROKE='var(--accent-dark)';
  let shapeSvg='';
  if(mode==='rects'){
    shapeSvg=rects.map(r=>`<rect x="${toX(r.x)}" y="${toY(r.y)}" width="${(r.w*scale).toFixed(1)}" height="${(r.h*scale).toFixed(1)}" fill="${FILL}" stroke="${STROKE}" stroke-width="1.4"/>`).join('');
  } else if(mode==='circle'){
    shapeSvg=`<circle cx="${(x0+dw/2).toFixed(1)}" cy="${(y0+dh/2).toFixed(1)}" r="${(dw/2).toFixed(1)}" fill="${FILL}" stroke="${STROKE}" stroke-width="1.4"/>`;
  } else if(mode==='ring'){
    const cx=x0+dw/2, cy=y0+dh/2, rOut=dw/2, t=(ex.t||0)*scale, rIn=Math.max(rOut-t,1);
    shapeSvg=`<path fill-rule="evenodd" d="M${(cx-rOut).toFixed(1)},${cy.toFixed(1)} a${rOut.toFixed(1)},${rOut.toFixed(1)} 0 1,0 ${(2*rOut).toFixed(1)},0 a${rOut.toFixed(1)},${rOut.toFixed(1)} 0 1,0 ${(-2*rOut).toFixed(1)},0 Z M${(cx-rIn).toFixed(1)},${cy.toFixed(1)} a${rIn.toFixed(1)},${rIn.toFixed(1)} 0 1,1 ${(2*rIn).toFixed(1)},0 a${rIn.toFixed(1)},${rIn.toFixed(1)} 0 1,1 ${(-2*rIn).toFixed(1)},0 Z" fill="${FILL}" stroke="${STROKE}" stroke-width="1.4"/>`;
  } else if(mode==='tube'){
    const t=(ex.t||0)*scale;
    const ix=x0+t, iy=y0+t, iw=Math.max(dw-2*t,1), ih=Math.max(dh-2*t,1);
    shapeSvg=`<path fill-rule="evenodd" d="M${x0.toFixed(1)},${y0.toFixed(1)} h${dw.toFixed(1)} v${dh.toFixed(1)} h${(-dw).toFixed(1)} Z M${ix.toFixed(1)},${iy.toFixed(1)} h${iw.toFixed(1)} v${ih.toFixed(1)} h${(-iw).toFixed(1)} Z" fill="${FILL}" stroke="${STROKE}" stroke-width="1.4"/>`;
  }
  const cyC=(y0+g.cTop*scale);
  const centroidSvg=`<line x1="${(x0-4).toFixed(1)}" y1="${cyC.toFixed(1)}" x2="${(x0+dw+4).toFixed(1)}" y2="${cyC.toFixed(1)}" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/><circle cx="${(x0+dw/2).toFixed(1)}" cy="${cyC.toFixed(1)}" r="2.4" fill="#dc2626"/>`;
  const labelX=x0+dw+10;
  const labelSvg=`<line x1="${labelX.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${labelX.toFixed(1)}" y2="${cyC.toFixed(1)}" stroke="#94a3b8" stroke-width="1"/>
    <line x1="${labelX.toFixed(1)}" y1="${cyC.toFixed(1)}" x2="${labelX.toFixed(1)}" y2="${(y0+dh).toFixed(1)}" stroke="#94a3b8" stroke-width="1"/>
    <text x="${(labelX+4).toFixed(1)}" y="${((y0+cyC)/2+3).toFixed(1)}" font-size="9.5" fill="#334155">e_g=${fmtSmart(g.cTop)}</text>
    <text x="${(labelX+4).toFixed(1)}" y="${((cyC+y0+dh)/2+3).toFixed(1)}" font-size="9.5" fill="#334155">e_d=${fmtSmart(g.cBot)}</text>`;
  return `<svg viewBox="0 0 ${VB_W} ${VB_H}" style="width:100%;max-width:220px;height:auto;display:block;margin:6px auto;">${shapeSvg}${centroidSvg}${labelSvg}</svg>`;
}
function updateSecPreview(){
  const el=document.getElementById('newSecPreview');
  if(!el) return;
  try{
    const g=computeSecGeom();
    const svg=renderSectionSvg(g);
    el.innerHTML=`${svg}<div class="muted" style="text-align:center;">A=${fmtSmart(g.A)} cm² &nbsp;·&nbsp; I=${fmtSmart(g.I)} cm⁴ &nbsp;·&nbsp; e_góra=${fmtSmart(g.cTop)} cm &nbsp;·&nbsp; e_dół=${fmtSmart(g.cBot)} cm</div>`;
  }catch(e){ el.innerHTML=''; }
}
function addSecFormHtml(){
  return `<div class="card" style="margin-top:6px;background:var(--surface);border-color:var(--input-border);">
    <div class="row"><label>Nazwa</label><input type="text" id="newSecName" value="Nowy przekrój"></div>
    <div class="row"><label>Rodzaj</label><select id="newSecCategory" onchange="onNewSecCategoryChange()">
      <option value="katalog" ${newSecCategoryState==='katalog'?'selected':''}>Z katalogu</option>
      <option value="ksztalt" ${newSecCategoryState==='ksztalt'?'selected':''}>Kształt definiowany</option>
      <option value="wlasny" ${newSecCategoryState==='wlasny'?'selected':''}>Własny (ręcznie)</option>
    </select></div>
    <div id="newSecSubFields">${subFieldsHtml()}</div>
    <div class="btnrow"><button class="mini on" onclick="addSection()">Dodaj</button><button class="mini" onclick="closeAddSecForm()">Anuluj</button></div>
  </div>`;
}
function addSection(){
  const name=document.getElementById('newSecName').value||'Przekrój';
  const g=computeSecGeom();
  const id=nextSecId++;
  const shapeTag = newSecCategoryState==='katalog'? ('cat'+newSecCatalogTypeState)
                 : newSecCategoryState==='ksztalt'? newSecShapeState
                 : 'custom';
  sections.push(Object.assign({id,name,shape:shapeTag,A:g.A,I:g.I,h:g.h,cTop:g.cTop,cBot:g.cBot},g.extra));
  addSecFormOpen=false; renderSidebar(); buildToolbar();
}
function removeSection(id){
  if(elements.some(e=>e.sectionId===id)){ setStatusHint('Nie można usunąć — przekrój jest przypisany do pręta.'); return; }
  if(sections.length<=1) return;
  sections=sections.filter(s=>s.id!==id);
  if(defaultSectionId===id) defaultSectionId=sections[0].id;
  renderSidebar(); buildToolbar();
}

/* =========================================================================
   INIT
   ========================================================================= */
function init(){
  canvas=document.getElementById('cv');
  ctx=canvas.getContext('2d');
  buildToolbar();
  initEvents();
  fitView();
  resizeCanvas();
  setMode('select');
  renderSidebar();
  render();

  // On mobile / embedded (iframe) hosts, the container can still be settling its
  // final size for a moment after first paint (fonts, host chrome, address bar,
  // safe-area insets) — resize/fit again once things are stable, unless the
  // person has already started interacting with the view themselves.
  const resettle = ()=>{
    if(userAdjustedView) return;
    resizeCanvas();
    fitView();
    render();
  };
  requestAnimationFrame(()=>requestAnimationFrame(resettle));
  setTimeout(resettle, 300);
  setTimeout(resettle, 900);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', ()=>{ resizeCanvas(); });
  }
}
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
